<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT App - JAMstack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @media (max-width: 768px) {
      .col-mobile-hide { display: none; }
      .col-mobile-full { width: 100% !important; }
    }
    .option-selected {
      border-color: #3b82f6 !important;
      background-color: #eff6ff !important;
    }
    .option-correct {
      border-color: #22c55e !important;
      background-color: #dcfce7 !important;
    }
    .option-wrong {
      border-color: #ef4444 !important;
      background-color: #fee2e2 !important;
    }
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <script>
    // ==========================================
    // KONFIGURASI SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://jdjdjtmprrkqyfetiqav.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IgTlYqF3N9mSt1QJHtTATw_XBZZ9szu";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let currentView = 'login';
    let currentExamData = null;
    let currentQuestionIndex = 0;
    let examTimer = null;
    let timeLeft = 0;
    let cheatCount = 0;
    let studentAnswers = {};
    let examStartTime = null;
    let isExamSubmitted = false;
    let isLoading = false;

    // ==========================================
    // RENDER ENGINE
    // ==========================================
    const app = document.getElementById('app');

    function render() {
      if (isLoading) {
        renderLoading();
        return;
      }
      if (currentView === 'login') renderLogin();
      else if (currentView === 'admin') renderAdmin();
      else if (currentView === 'student') renderStudentExam();
      else if (currentView === 'result') renderResult();
    }

    function renderLoading() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
          <div class="text-center">
            <div class="loading-spinner mx-auto"></div>
            <p class="mt-4 text-gray-600">Memuat data...</p>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 1. LOGIN VIEW
    // ==========================================
    function renderLogin() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
          <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-6">
              <h1 class="text-3xl font-bold text-gray-800">CBT App</h1>
              <p class="text-gray-500 mt-1">Computer Based Test Platform</p>
            </div>
            
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap <span class="text-red-500">*</span></label>
                <input id="login-name" type="text" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Nama Siswa" required />
              </div>
              
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Sekolah</label>
                  <input id="login-school" type="text" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="SMA Negeri 1" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700">Cabang</label>
                  <input id="login-branch" type="text" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Jakarta" />
                </div>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-gray-700">Pilih Ujian</label>
                <select id="login-exam" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white">
                  <option value="exam1">Bahasa Inggris 11 SMA S1 (PAS)</option>
                  <option value="exam2">Matematika 12 SMA S2 (UH)</option>
                  <option value="exam3">Fisika 10 SMA S1 (PTS)</option>
                </select>
              </div>
              
              <button onclick="loginStudent()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200">
                Mulai Ujian
              </button>
              
              <div class="relative">
                <div class="absolute inset-0 flex items-center">
                  <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                  <span class="px-2 bg-white text-gray-500">atau</span>
                </div>
              </div>
              
              <button onclick="loginAdmin()" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition duration-200">
                Login Admin
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // LOGIN FUNCTIONS
    // ==========================================
    async function loginStudent() {
      const name = document.getElementById('login-name').value.trim();
      if(!name) {
        alert('Mohon isi nama lengkap Anda!');
        document.getElementById('login-name').focus();
        return;
      }
      
      window.studentData = { 
        name: name, 
        school: document.getElementById('login-school').value.trim() || '-',
        branch: document.getElementById('login-branch').value.trim() || '-',
        exam_code: document.getElementById('login-exam').value
      };
      
      const examTitle = document.getElementById('login-exam').selectedOptions[0].text;
      
      isLoading = true;
      render();
      
      try {
        const { data, error } = await supabase
          .from('question_banks')
          .select('*')
          .eq('judul_tes', examTitle)
          .single();
        
        isLoading = false;
        
        if(error || !data) {
          console.warn('Data tidak ditemukan di Supabase, menggunakan data lokal');
          useLocalExamData();
          return;
        }
        
        // Validasi data questions
        if(!data.questions || !Array.isArray(data.questions) || data.questions.length === 0) {
          console.warn('Data questions kosong atau tidak valid, menggunakan data lokal');
          useLocalExamData();
          return;
        }
        
        currentExamData = {
          judul: data.judul_tes,
          durasi: data.durasi || 3600,
          questions: data.questions
        };
        
        startExam();
        
      } catch(err) {
        isLoading = false;
        console.error('Error loading exam:', err);
        useLocalExamData();
      }
    }

    function useLocalExamData() {
      const examData = {
        exam1: {
          judul: "Bahasa Inggris 11 SMA S1 (PAS)",
          durasi: 3600,
          questions: [
            { id: 1, narasi: "Read the following text carefully. The rapid advancement of technology has changed how we communicate. While it brings people closer, it also creates distances in real life.", text: "What is the main idea of the text?", options: ["Technology is bad.", "Technology changes communication.", "People are getting closer.", "Real life is better."], type: "PG", answer: 1 },
            { id: 2, narasi: null, text: "Choose the correct synonym for 'Rapid'.", options: ["Slow", "Fast", "Late", "Early"], type: "PG", answer: 1 },
            { id: 3, narasi: "Based on the text above.", text: "Does technology create distances in real life?", options: ["True", "False"], type: "BS", answer: 0 }
          ]
        },
        exam2: {
          judul: "Matematika 12 SMA S2 (UH)",
          durasi: 2700,
          questions: [
            { id: 1, narasi: null, text: "Berapakah hasil dari 2 + 2?", options: ["3", "4", "5", "6"], type: "PG", answer: 1 },
            { id: 2, narasi: null, text: "Berapakah hasil dari 3 × 7?", options: ["20", "21", "22", "23"], type: "PG", answer: 1 },
            { id: 3, narasi: null, text: "Akar kuadrat dari 144 adalah...", options: ["10", "11", "12", "13"], type: "PG", answer: 2 }
          ]
        },
        exam3: {
          judul: "Fisika 10 SMA S1 (PTS)",
          durasi: 5400,
          questions: [
            { id: 1, narasi: "Perhatikan gambar berikut...", text: "Apa itu gaya?", options: ["Dorongan", "Tarikan", "Dorongan dan Tarikan", "Semua benar"], type: "PG", answer: 2 }
          ]
        }
      };
      
      currentExamData = examData[window.studentData.exam_code] || examData.exam1;
      startExam();
    }

    function startExam() {
      studentAnswers = {};
      currentExamData.questions.forEach(q => {
        studentAnswers[q.id] = q.id;
      });
      
      currentView = 'student';
      currentQuestionIndex = 0;
      timeLeft = currentExamData.durasi;
      cheatCount = 0;
      isExamSubmitted = false;
      examStartTime = new Date();
      
      render();
      startTimer();
      activateAntiCheat();
    }

    function loginAdmin() {
      window.studentData = { name: "Admin", school: "-", branch: "-" };
      currentView = 'admin';
      render();
    }

    // ==========================================
    // 2. STUDENT EXAM VIEW
    // ==========================================
    function renderStudentExam() {
      if (!currentExamData || !currentExamData.questions || currentExamData.questions.length === 0) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-gray-100">
            <div class="text-center p-8 bg-white rounded-xl shadow-lg">
              <h2 class="text-2xl font-bold text-red-600 mb-4">⚠️ Error</h2>
              <p class="text-gray-600">Tidak ada data soal yang tersedia.</p>
              <button onclick="backToLogin()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg">Kembali</button>
            </div>
          </div>
        `;
        return;
      }

      const q = currentExamData.questions[currentQuestionIndex];
      const totalQ = currentExamData.questions.length;
      const selectedAnswer = studentAnswers[q.id];

      app.innerHTML = `
        <div class="h-screen flex flex-col overflow-hidden">
          <!-- Header -->
          <div class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div>
              <h1 class="font-bold text-lg">${currentExamData.judul}</h1>
              <p class="text-xs opacity-80">${window.studentData.name} - ${new Date().toLocaleDateString('id-ID')}</p>
            </div>
            <div class="flex items-center gap-4">
              <div id="cheat-warn" class="bg-red-500 px-3 py-1 rounded text-sm ${cheatCount === 0 ? 'hidden' : ''}">
                ⚠️ Pelanggaran: <span id="cheat-count">${cheatCount}</span>
              </div>
              <div class="bg-red-500 px-4 py-2 rounded-lg font-mono font-bold text-xl">
                <span id="timer">00:00</span>
              </div>
            </div>
          </div>

          <!-- 3 Kolom Layout -->
          <div class="flex flex-1 overflow-hidden">
            
            <!-- Kolom 1: Narasi -->
            <div class="col-mobile-hide w-1/4 bg-white border-r p-4 overflow-y-auto">
              <h2 class="font-bold mb-2 text-blue-700 border-b pb-2">📖 Narasi</h2>
              ${q.narasi ? `<div class="text-sm text-gray-700 prose max-w-none">${q.narasi}</div>` : '<p class="text-gray-400 italic text-sm">Tidak ada narasi untuk soal ini.</p>'}
            </div>

            <!-- Kolom 2: Soal -->
            <div class="col-mobile-full w-2/4 p-6 overflow-y-auto bg-gray-50">
              <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                  <div>
                    <span class="text-sm font-semibold text-blue-600">Soal ${currentQuestionIndex + 1} dari ${totalQ}</span>
                  </div>
                  <span class="text-xs px-2 py-1 bg-gray-100 rounded-full text-gray-600">${q.type || 'PG'}</span>
                </div>
                
                <p class="mb-6 text-lg font-medium">${q.text}</p>
                
                <!-- Opsi Jawaban -->
                <div class="space-y-3">
                  ${q.options.map((opt, i) => `
                    <div onclick="selectAnswer(${i})" class="cursor-pointer p-3 border-2 rounded-lg hover:bg-blue-50 hover:border-blue-400 transition flex items-center gap-3 ${selectedAnswer === i ? 'option-selected' : ''}" data-option-index="${i}">
                      <span class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-600">${String.fromCharCode(65 + i)}</span>
                      <span>${opt}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
              
              <!-- Tombol Navigasi -->
              <div class="flex justify-between mt-6">
                <button ${currentQuestionIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()" class="bg-gray-200 px-6 py-2 rounded-lg font-medium disabled:opacity-50 hover:bg-gray-300 transition flex items-center gap-2">
                  ← Sebelumnya
                </button>
                ${currentQuestionIndex < totalQ - 1 ? `
                  <button onclick="nextQuestion()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition flex items-center gap-2">
                    Selanjutnya →
                  </button>
                ` : `
                  <button onclick="confirmSubmitExam()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition animate-pulse">
                    ✅ Kirim Jawaban
                  </button>
                `}
              </div>
            </div>

            <!-- Kolom 3: Navigasi Nomor -->
            <div class="col-mobile-hide w-1/4 bg-white border-l p-4 overflow-y-auto">
              <h2 class="font-bold mb-4 text-blue-700 border-b pb-2">Navigasi Soal</h2>
              <div class="grid grid-cols-4 gap-2">
                ${currentExamData.questions.map((q, i) => `
                  <button onclick="goToQuestion(${i})" class="aspect-square flex items-center justify-center rounded-lg font-bold border-2 transition ${i === currentQuestionIndex ? 'bg-blue-600 text-white border-blue-600' : studentAnswers[q.id] !== null && studentAnswers[q.id] !== undefined ? 'bg-green-100 text-green-700 border-green-300' : 'bg-gray-50 text-gray-600 border-gray-200'}">
                    ${i + 1}
                  </button>
                `).join('')}
              </div>
              <div class="mt-4 text-xs text-gray-500">
                <span class="inline-block w-3 h-3 bg-green-100 border border-green-300 rounded mr-1"></span> Terjawab
                <span class="inline-block w-3 h-3 bg-gray-50 border border-gray-200 rounded ml-2 mr-1"></span> Belum
              </div>
              <button onclick="confirmSubmitExam()" class="w-full mt-6 bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">
                Kirim Jawaban
              </button>
            </div>

          </div>
        </div>
      `;
      updateTimerDisplay();
    }

    // ==========================================
    // ANSWER SELECTION
    // ==========================================
    function selectAnswer(index) {
      const q = currentExamData.questions[currentQuestionIndex];
      
      studentAnswers[q.id] = index;
      
      const options = document.querySelectorAll('.cursor-pointer');
      options.forEach((opt, idx) => {
        if(idx === index) {
          opt.classList.add('option-selected');
        } else {
          opt.classList.remove('option-selected');
        }
      });
      
      const navButtons = document.querySelectorAll('.grid button');
      if(navButtons[currentQuestionIndex]) {
        navButtons[currentQuestionIndex].className = 'aspect-square flex items-center justify-center rounded-lg font-bold border-2 bg-green-100 text-green-700 border-green-300';
      }
    }

    // ==========================================
    // NAVIGATION FUNCTIONS
    // ==========================================
    function nextQuestion() { 
      if(currentQuestionIndex < currentExamData.questions.length-1) { 
        currentQuestionIndex++; 
        render(); 
      } 
    }
    
    function prevQuestion() { 
      if(currentQuestionIndex > 0) { 
        currentQuestionIndex--; 
        render(); 
      } 
    }
    
    function goToQuestion(i) { 
      if(i >= 0 && i < currentExamData.questions.length) {
        currentQuestionIndex = i; 
        render(); 
      }
    }

    // ==========================================
    // SUBMIT EXAM
    // ==========================================
    function confirmSubmitExam() {
      const unanswered = currentExamData.questions.filter(q => 
        studentAnswers[q.id] === null || studentAnswers[q.id] === undefined
      );
      
      if(unanswered.length > 0) {
        if(!confirm(`Anda belum menjawab ${unanswered.length} soal. Yakin ingin mengirim?`)) {
          return;
        }
      } else {
        if(!confirm('Yakin untuk mengirim jawaban? Anda tidak dapat mengubahnya lagi.')) {
          return;
        }
      }
      
      submitExam();
    }

    async function submitExam() {
      if(isExamSubmitted) return;
      isExamSubmitted = true;
      
      clearInterval(examTimer);
      
      let correct = 0;
      let total = currentExamData.questions.length;
      currentExamData.questions.forEach(q => {
        if(studentAnswers[q.id] === q.answer) {
          correct++;
        }
      });
      
      const score = Math.round((correct / total) * 100);
      
      const examResult = {
        student_name: window.studentData.name,
        school: window.studentData.school,
        branch: window.studentData.branch,
        exam_title: currentExamData.judul,
        total_questions: total,
        correct_answers: correct,
        score: score,
        cheating_count: cheatCount,
        duration_seconds: currentExamData.durasi - timeLeft,
        submitted_at: new Date().toISOString(),
        answers: studentAnswers
      };
      
      console.log('Hasil Ujian:', examResult);
      
      try {
        const { data, error } = await supabase
          .from('exam_results')
          .insert([examResult]);
        
        if(error) throw error;
        
        alert(`✅ Ujian selesai! Nilai Anda: ${score}`);
        currentView = 'result';
        renderResult(examResult);
      } catch(err) {
        console.error('Error saving result:', err);
        alert(`⚠️ Gagal menyimpan hasil: ${err.message}\n\nTetap bisa melihat hasil di konsol.`);
        currentView = 'result';
        renderResult(examResult);
      }
    }

    // ==========================================
    // RESULT VIEW
    // ==========================================
    function renderResult(result = null) {
      if(!result) {
        result = window.lastExamResult || { score: 0, correct_answers: 0, total_questions: 0 };
      }
      
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
          <div class="bg-white p-8 rounded-2xl shadow-xl max-w-2xl w-full">
            <div class="text-center mb-6">
              <div class="text-6xl mb-4">${result.score >= 70 ? '🎉' : '📚'}</div>
              <h1 class="text-3xl font-bold text-gray-800">Ujian Selesai!</h1>
              <p class="text-gray-500 mt-1">${window.studentData.name}</p>
            </div>
            
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-xl mb-6">
              <div class="text-center">
                <div class="text-5xl font-bold text-blue-600">${result.score}%</div>
                <div class="text-sm text-gray-500 mt-1">Nilai Akhir</div>
              </div>
              <div class="grid grid-cols-2 gap-4 mt-4 text-center">
                <div>
                  <div class="text-2xl font-bold text-green-600">${result.correct_answers}</div>
                  <div class="text-sm text-gray-500">Benar</div>
                </div>
                <div>
                  <div class="text-2xl font-bold text-red-600">${result.total_questions - result.correct_answers}</div>
                  <div class="text-sm text-gray-500">Salah</div>
                </div>
              </div>
            </div>
            
            ${result.cheating_count > 0 ? `
              <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg mb-4">
                <p class="text-yellow-800 text-sm">⚠️ Terdeteksi ${result.cheating_count} kali pelanggaran</p>
              </div>
            ` : ''}
            
            <button onclick="backToLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
              Kembali ke Login
            </button>
          </div>
        </div>
      `;
    }

    function backToLogin() {
      if(examTimer) {
        clearInterval(examTimer);
        examTimer = null;
      }
      currentView = 'login';
      render();
    }

    // ==========================================
    // 3. TIMER & ANTI CURANG
    // ==========================================
    function startTimer() {
      if(examTimer) clearInterval(examTimer);
      
      examTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(examTimer);
          alert('⏰ Waktu habis! Ujian otomatis terkirim.');
          submitExam();
        }
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const timerEl = document.getElementById('timer');
      if(timerEl) {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        
        if(timeLeft < 300) {
          timerEl.classList.add('text-yellow-200');
        }
        if(timeLeft < 60) {
          timerEl.classList.add('animate-pulse');
        }
      }
    }

    function activateAntiCheat() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      
      document.addEventListener('keydown', (e) => {
        if(e.ctrlKey && ['c','v','x','u'].includes(e.key.toLowerCase())) {
          e.preventDefault();
          detectCheat('Keyboard shortcut');
        }
        if(e.key === 'F12') {
          e.preventDefault();
          detectCheat('F12 pressed');
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && currentView === 'student') {
          detectCheat('Switch tab/window');
        }
      });
      
      document.addEventListener('copy', (e) => {
        e.preventDefault();
        detectCheat('Copy');
      });
      
      document.addEventListener('paste', (e) => {
        e.preventDefault();
        detectCheat('Paste');
      });
    }

    function detectCheat(action) {
      cheatCount++;
      const warnEl = document.getElementById('cheat-warn');
      const countEl = document.getElementById('cheat-count');
      if(warnEl) warnEl.classList.remove('hidden');
      if(countEl) countEl.textContent = cheatCount;
      
      console.warn(`⚠️ Pelanggaran #${cheatCount}: ${action} pada ${new Date().toISOString()}`);
      alert(`⚠️ PERINGATAN ${cheatCount}x: Anda ${action}! Tindakan ini tercatat di sistem.`);
    }

    // ==========================================
    // 4. ADMIN DASHBOARD VIEW
    // ==========================================
    function renderAdmin() {
      app.innerHTML = `
        <div class="min-h-screen flex bg-gray-100">
          <!-- Sidebar -->
          <div class="w-64 bg-blue-800 text-white p-4 hidden md:block min-h-screen">
            <h1 class="text-xl font-bold mb-8">📊 Admin Panel</h1>
            <nav class="space-y-2">
              <a href="#" class="block py-2 px-4 rounded bg-blue-700 font-medium">📝 Buat Soal</a>
              <a href="#" class="block py-2 px-4 rounded hover:bg-blue-700 transition">📚 Brankas Soal</a>
              <a href="#" class="block py-2 px-4 rounded hover:bg-blue-700 transition">👀 Pantau Ujian</a>
              <a href="#" class="block py-2 px-4 rounded hover:bg-blue-700 transition">📈 Analisa Hasil</a>
              <a href="#" class="block py-2 px-4 rounded hover:bg-blue-700 transition">⚙️ Setting</a>
            </nav>
            <div class="absolute bottom-4">
              <button onclick="logout()" class="text-red-300 hover:text-red-100 transition font-medium">🚪 Logout</button>
            </div>
          </div>

          <!-- Main Content -->
          <div class="flex-1 p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-2xl font-bold text-gray-800">📝 Buat Soal</h2>
              <button onclick="logout()" class="md:hidden text-red-500 font-medium">Logout</button>
            </div>

            <!-- Form Setting Soal -->
            <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
              <h3 class="font-bold text-lg mb-4 text-gray-700">⚙️ Setting Soal</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" placeholder="Mapel" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-mapel">
                <input type="text" placeholder="Kelas" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-kelas">
                <select class="px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-tipe">
                  <option value="UH">UH</option>
                  <option value="PTS">PTS</option>
                  <option value="PAS">PAS</option>
                  <option value="TKA">TKA</option>
                </select>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" placeholder="Judul Tes" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-judul">
                <input type="number" placeholder="Durasi (detik)" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-durasi" value="3600">
              </div>
              <div class="flex items-center gap-4 mt-4">
                <label class="flex items-center gap-2 text-sm">
                  <input type="checkbox" id="f-narasi"> Pakai Narasi
                </label>
                <select id="f-narasi-count" class="text-sm px-2 py-1 border rounded bg-white hidden">
                  <option value="2">2 Soal per Narasi</option>
                  <option value="3">3 Soal per Narasi</option>
                  <option value="5">5 Soal per Narasi</option>
                </select>
              </div>
            </div>

            <!-- Form Buat Soal Dinamis -->
            <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
              <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-gray-700">📌 Soal No. 1</h3>
                <select class="text-sm px-2 py-1 border rounded bg-white" id="f-tipe-soal">
                  <option value="PG">Pilihan Ganda (A-E)</option>
                  <option value="PGK">Pilihan Ganda Kompleks</option>
                  <option value="BS">Benar / Salah</option>
                  <option value="ST">Setuju / Tidak Setuju</option>
                </select>
              </div>
              <textarea placeholder="Teks Soal..." class="w-full px-4 py-2 border rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-teks-soal" rows="3"></textarea>
              <input type="text" placeholder="Narasi (opsional)" class="w-full px-4 py-2 border rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-narasi-soal">
              <button class="text-sm text-blue-600 mb-4 font-medium hover:text-blue-800">+ Sisipkan Gambar / Copy Link</button>
              <div class="grid grid-cols-2 gap-2">
                <input placeholder="Opsi A" class="px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-opsi-a">
                <input placeholder="Opsi B" class="px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-opsi-b">
                <input placeholder="Opsi C" class="px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-opsi-c">
                <input placeholder="Opsi D" class="px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" id="f-opsi-d">
              </div>
              <div class="mt-3">
                <label class="text-sm font-medium text-gray-700">Jawaban Benar:</label>
                <select class="ml-2 px-3 py-1 border rounded text-sm" id="f-jawaban">
                  <option value="0">A</option>
                  <option value="1">B</option>
                  <option value="2">C</option>
                  <option value="3">D</option>
                </select>
              </div>
            </div>

            <button onclick="saveToSupabase()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
              💾 Simpan ke Brankas
            </button>
            
            <!-- Dashboard Stats -->
            <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <h4 class="text-sm text-gray-500">Soal Aktif</h4>
                <p class="text-2xl font-bold">2 Ujian</p>
              </div>
              <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
                <h4 class="text-sm text-gray-500">Siswa Sedang Tes</h4>
                <p class="text-2xl font-bold">15 Siswa</p>
              </div>
              <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500">
                <h4 class="text-sm text-gray-500">Pelanggaran Terdeteksi</h4>
                <p class="text-2xl font-bold">1 Siswa</p>
              </div>
            </div>
          </div>
        </div>
      `;

      const narasiCheckbox = document.getElementById('f-narasi');
      if(narasiCheckbox) {
        narasiCheckbox.addEventListener('change', (e) => {
          document.getElementById('f-narasi-count').classList.toggle('hidden', !e.target.checked);
        });
      }
    }

    async function saveToSupabase() {
      const mapel = document.getElementById('f-mapel')?.value.trim();
      const kelas = document.getElementById('f-kelas')?.value.trim();
      const tipe = document.getElementById('f-tipe')?.value;
      const judul = document.getElementById('f-judul')?.value.trim();
      const durasi = parseInt(document.getElementById('f-durasi')?.value) || 3600;
      const teksSoal = document.getElementById('f-teks-soal')?.value.trim();
      const narasi = document.getElementById('f-narasi-soal')?.value.trim() || null;
      const tipeSoal = document.getElementById('f-tipe-soal')?.value || 'PG';
      const jawaban = parseInt(document.getElementById('f-jawaban')?.value) || 0;
      
      const opsiA = document.getElementById('f-opsi-a')?.value.trim();
      const opsiB = document.getElementById('f-opsi-b')?.value.trim();
      const opsiC = document.getElementById('f-opsi-c')?.value.trim();
      const opsiD = document.getElementById('f-opsi-d')?.value.trim();
      
      if(!mapel) {
        alert('Mohon isi Mapel!');
        document.getElementById('f-mapel').focus();
        return;
      }
      if(!judul) {
        alert('Mohon isi Judul Tes!');
        document.getElementById('f-judul').focus();
        return;
      }
      if(!teksSoal) {
        alert('Mohon isi Teks Soal!');
        document.getElementById('f-teks-soal').focus();
        return;
      }
      
      const options = [opsiA, opsiB, opsiC, opsiD].filter(opt => opt && opt.length > 0);
      if(options.length < 2) {
        alert('Mohon isi minimal 2 opsi jawaban!');
        return;
      }

      const questions = [{
        id: 1,
        text: teksSoal,
        narasi: narasi,
        options: options,
        type: tipeSoal,
        answer: jawaban
      }];

      try {
        const { data, error } = await supabase
          .from('question_banks')
          .insert([{ 
            mapel, 
            kelas, 
            tipe_tes: tipe, 
            judul_tes: judul,
            durasi: durasi,
            questions,
            created_at: new Date().toISOString()
          }]);

        if(error) throw error;
        alert('✅ Berhasil simpan ke Brankas!');
        
        document.getElementById('f-mapel').value = '';
        document.getElementById('f-kelas').value = '';
        document.getElementById('f-judul').value = '';
        document.getElementById('f-teks-soal').value = '';
        document.getElementById('f-narasi-soal').value = '';
        document.getElementById('f-opsi-a').value = '';
        document.getElementById('f-opsi-b').value = '';
        document.getElementById('f-opsi-c').value = '';
        document.getElementById('f-opsi-d').value = '';
        
      } catch (err) {
        console.error('Error:', err);
        alert('❌ Gagal simpan: ' + err.message);
      }
    }

    // ==========================================
    // LOGOUT
    // ==========================================
    function logout() {
      if(examTimer) {
        clearInterval(examTimer);
        examTimer = null;
      }
      currentView = 'login';
      render();
    }

    // ==========================================
    // INIT APP
    // ==========================================
    render();
  </script>
</body>
</html>
