name: Supabase Keep-Alive

on:
  schedule:
    # Setiap hari pada 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  # Memungkinkan pemicu manual dari tab Actions untuk pengujian
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "🚀 Memulai ping Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "📡 Kode status respons: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Supabase aktif"
          else
            echo "⚠️ Supabase mungkin tidak dapat diakses, kode status: $STATUS"
            exit 1
          fi