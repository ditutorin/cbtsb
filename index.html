<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .option-selected {
      border-color: #3b82f6 !important;
      background-color: #eff6ff !important;
    }
    .option-correct {
      border-color: #22c55e !important;
      background-color: #dcfce7 !important;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
      background: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { border-color: #93c5fd; }
    .nav-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .nav-btn.answered {
      background: #dcfce7;
      color: #16a34a;
      border-color: #86efac;
    }
    .image-preview {
      max-width: 200px;
      max-height: 150px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
    }
    .option-preview {
      max-width: 80px;
      max-height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }
    .option-input {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .option-input input[type="text"] {
      flex: 1;
      min-width: 100px;
    }
    .option-input input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .option-input .remove-option {
      color: #ef4444;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
    }
    .option-input .remove-option:hover {
      color: #dc2626;
    }
    .drag-over {
      border: 3px dashed #3b82f6 !important;
      background: #eff6ff !important;
    }
    .excel-template {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      font-size: 12px;
      font-family: monospace;
      overflow-x: auto;
      white-space: pre;
    }
    .admin-login-btn {
      display: none !important;
    }
    .admin-login-btn.visible {
      display: block !important;
    }
    .option-image-upload {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .option-image-upload input[type="file"] {
      font-size: 11px;
      max-width: 100px;
    }
    .option-image-upload .preview-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d1d5db;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
// ==========================================
// SUPABASE
// ==========================================
const SUPABASE_URL = "https://jdjdjtmprrkqyfetiqav.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkamRqdG1wcnJrcXlmZXRpcWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjEyMjMsImV4cCI6MjA5MDU5NzIyM30.sPrxv4iGbU2SecxkTSmYuIYdpzqSI-s0hf25P1BLfdc";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

console.log('✅ Supabase connected');

// ==========================================
// HASH ROUTING
// ==========================================
function checkHash() {
  const hash = window.location.hash;
  if (hash === '#admin') {
    console.log('🔐 Admin access via hash');
    goToAdmin();
  }
}

window.addEventListener('hashchange', checkHash);

// ==========================================
// DATA UJIAN (Fallback)
// ==========================================
const EXAM_DATA = {
  judul: 'Bahasa Inggris 11 SMA S1 (PAS)',
  durasi: 3600,
  questions: [
    { id: 1, text: 'What is the main idea of the text?', narasi: 'Read the following text carefully.', options: ['Technology is bad.', 'Technology changes communication.', 'People are getting closer.', 'Real life is better.'], type: 'PG', answer: [1] },
    { id: 2, text: 'Choose the correct synonym for Rapid.', narasi: null, options: ['Slow', 'Fast', 'Late', 'Early'], type: 'PG', answer: [1] },
    { id: 3, text: 'Does technology create distances in real life?', narasi: 'Based on the text above.', options: ['True', 'False'], type: 'BS', answer: [0] }
  ]
};

// ==========================================
// STATE
// ==========================================
let state = {
  view: 'login',
  student: { name: '', school: '', branch: '' },
  exam: null,
  currentIndex: 0,
  answers: {},
  timeLeft: 0,
  timer: null,
  cheatCount: 0,
  submitted: false,
  result: null,
  adminQuestions: [],
  currentQuestionNumber: 1,
  imageData: null,
  optionCount: 4,
  optionImages: {} // menyimpan URL gambar per opsi
};

const app = document.getElementById('app');

// ==========================================
// RENDER
// ==========================================
function render() {
  console.log('📌 Render view:', state.view);
  switch(state.view) {
    case 'login': renderLogin(); break;
    case 'student': renderStudent(); break;
    case 'admin': renderAdmin(); break;
    case 'result': renderResult(); break;
    default: renderLogin();
  }
}

// ==========================================
// LOGIN
// ==========================================
function renderLogin() {
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700 p-4">
      <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <h1 class="text-3xl font-bold text-gray-800">📝 CBT App</h1>
          <p class="text-gray-500 text-sm">Computer Based Test Platform</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Nama Lengkap <span class="text-red-500">*</span></label>
            <input id="login-name" type="text" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan nama Anda" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700">Sekolah</label>
              <input id="login-school" type="text" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Nama sekolah" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">kota/Kab.</label>
              <input id="login-branch" type="text" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="kota/Kab." />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Pilih Ujian</label>
            <select id="login-exam" class="w-full mt-1 px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="Bahasa Inggris 11 SMA S1 (PAS)">Bahasa Inggris 11 SMA S1 (PAS)</option>
              <option value="Matematika 12 SMA S2 (UH)">Matematika 12 SMA S2 (UH)</option>
              <option value="Fisika 10 SMA S1 (PTS)">Fisika 10 SMA S1 (PTS)</option>
            </select>
          </div>

          <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
            🚀 Mulai Ujian
          </button>

          <div class="admin-login-btn hidden">
            <div class="relative">
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
              <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">atau</span></div>
            </div>
            <button onclick="goToAdmin()" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition mt-4">
              🔐 Login Admin
            </button>
          </div>
                    
        </div>
      </div>
    </div>
  `;
}

function goToAdmin() {
  console.log('🔐 Go to Admin');
  state.view = 'admin';
  state.student = { name: 'Admin', school: '-', branch: '-' };
  state.adminQuestions = [];
  state.currentQuestionNumber = 1;
  state.imageData = null;
  state.optionCount = 4;
  state.optionImages = {};
  render();
}

// ==========================================
// HANDLE LOGIN
// ==========================================
async function handleLogin() {
  const name = document.getElementById('login-name').value.trim();
  if (!name) {
    alert('⚠️ Nama lengkap wajib diisi!');
    document.getElementById('login-name').focus();
    return;
  }

  state.student = {
    name: name,
    school: document.getElementById('login-school').value.trim() || '-',
    branch: document.getElementById('login-branch').value.trim() || '-'
  };

  const examTitle = document.getElementById('login-exam').value;

  try {
    console.log('📚 Mencari data dari Supabase...');
    const { data, error } = await sb
      .from('question_banks')
      .select('*')
      .eq('judul_tes', examTitle)
      .maybeSingle();

    if (error) {
      console.warn('⚠️ Error dari Supabase:', error.message);
      throw error;
    }

    if (data && data.questions) {
      console.log('✅ Data dari Supabase ditemukan!');
      state.exam = {
        judul: data.judul_tes,
        durasi: data.durasi || 3600,
        questions: data.questions
      };
    } else {
      console.log('📦 Pakai data lokal (fallback)');
      state.exam = EXAM_DATA;
    }
  } catch (err) {
    console.log('📦 Pakai data lokal (fallback karena error)');
    state.exam = EXAM_DATA;
  }

  state.answers = {};
  state.exam.questions.forEach(q => {
    state.answers[q.id] = [];
  });
  state.currentIndex = 0;
  state.timeLeft = state.exam.durasi;
  state.cheatCount = 0;
  state.submitted = false;
  state.view = 'student';

  render();
  startTimer();
  activateAntiCheat();
}

// ==========================================
// STUDENT EXAM
// ==========================================
function renderStudent() {
  const exam = state.exam;
  if (!exam || !exam.questions || exam.questions.length === 0) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center"><p class="text-red-600">Error: Data ujian kosong</p></div>`;
    return;
  }

  const q = exam.questions[state.currentIndex];
  const total = exam.questions.length;
  const selected = state.answers[q.id] || [];
  const isMultiSelect = q.type === 'PGK' || q.type === 'ST' || q.type === 'BSK';

  // Cek apakah options berupa array of objects (dengan gambar) atau array of strings
  const isOptionWithImage = q.options && q.options.length > 0 && typeof q.options[0] === 'object';

  app.innerHTML = `
    <div class="h-screen flex flex-col bg-gray-50">
      <header class="bg-blue-600 text-white p-3 flex flex-wrap justify-between items-center shadow-lg">
        <div class="flex-1 min-w-0">
          <h1 class="font-bold text-sm sm:text-lg truncate">${exam.judul}</h1>
          <p class="text-xs opacity-80">${state.student.name}</p>
        </div>
        <div class="flex items-center gap-3">
          <div id="cheat-warn" class="bg-red-500 px-2 py-0.5 rounded text-xs ${state.cheatCount === 0 ? 'hidden' : ''}">
            ⚠️ ${state.cheatCount}x
          </div>
          <div class="bg-red-500 px-3 py-1 rounded-lg font-mono font-bold text-lg sm:text-xl">
            <span id="timer">00:00</span>
          </div>
        </div>
      </header>

      <div class="flex-1 overflow-hidden flex flex-col md:flex-row">
        <div class="hidden md:block w-1/4 bg-white border-r p-4 overflow-y-auto">
          <h3 class="font-bold text-blue-700 border-b pb-2 mb-3">📖 Narasi</h3>
          ${q.narasi ? `<div class="text-sm text-gray-700">${q.narasi}</div>` : '<p class="text-gray-400 text-sm italic">Tidak ada narasi</p>'}
          ${q.image ? `<img src="${q.image}" class="mt-3 image-preview" alt="Gambar soal" />` : ''}
        </div>

        <div class="flex-1 p-4 overflow-y-auto">
          <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6">
            <div class="flex justify-between items-center mb-4">
              <span class="text-sm font-semibold text-blue-600">Soal ${state.currentIndex + 1} dari ${total}</span>
              <span class="text-xs bg-gray-100 px-2 py-1 rounded-full">${q.type || 'PG'}</span>
            </div>

            <p class="text-base sm:text-lg font-medium mb-5">${q.text}</p>
            ${q.image ? `<img src="${q.image}" class="mb-4 image-preview" alt="Gambar soal" />` : ''}

            <div class="space-y-2">
              ${q.options.map((opt, i) => {
                const label = String.fromCharCode(65 + i);
                const text = isOptionWithImage ? opt.text : opt;
                const image = isOptionWithImage ? opt.image : null;
                return `
                  <div onclick="${isMultiSelect ? `toggleAnswer(${i})` : `selectAnswer(${i})`}" 
                       class="cursor-pointer p-3 border-2 rounded-lg hover:bg-blue-50 hover:border-blue-300 transition flex items-center gap-3 ${selected.includes(i) ? 'option-selected' : ''}">
                    <span class="w-7 h-7 bg-gray-100 rounded-full flex items-center justify-center font-bold text-sm text-gray-600 flex-shrink-0">${label}</span>
                    ${image ? `<img src="${image}" class="option-preview flex-shrink-0" alt="Opsi ${label}" />` : ''}
                    <span>${text}</span>
                    ${isMultiSelect ? `<span class="ml-auto text-xs text-gray-400">${selected.includes(i) ? '✓' : ''}</span>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
            ${isMultiSelect ? `<p class="text-xs text-gray-400 mt-2">* Pilih lebih dari satu jawaban</p>` : ''}
          </div>

          <div class="flex justify-between mt-4 gap-2">
            <button ${state.currentIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()" class="px-4 py-2 bg-gray-200 rounded-lg font-medium disabled:opacity-50 hover:bg-gray-300 transition">
              ← Sebelumnya
            </button>
            ${state.currentIndex < total - 1 ? `
              <button onclick="nextQuestion()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                Selanjutnya →
              </button>
            ` : `
              <button onclick="confirmSubmit()" class="px-4 py-2 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition animate-pulse">
                ✅ Kirim
              </button>
            `}
          </div>
        </div>

        <div class="hidden md:block w-1/4 bg-white border-l p-4 overflow-y-auto">
          <h3 class="font-bold text-blue-700 border-b pb-2 mb-3">Navigasi</h3>
          <div class="grid grid-cols-4 gap-2">
            ${exam.questions.map((q, i) => `
              <button onclick="goToQuestion(${i})" class="nav-btn ${i === state.currentIndex ? 'active' : ''} ${state.answers[q.id] && state.answers[q.id].length > 0 ? 'answered' : ''}">
                ${i + 1}
              </button>
            `).join('')}
          </div>
          <div class="mt-3 text-xs text-gray-500">
            <span class="inline-block w-3 h-3 bg-green-200 border border-green-400 rounded mr-1"></span> Terjawab
            <span class="inline-block w-3 h-3 bg-white border border-gray-300 rounded ml-3 mr-1"></span> Belum
          </div>
          <button onclick="confirmSubmit()" class="w-full mt-4 bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">
            Kirim Jawaban
          </button>
        </div>
      </div>
    </div>
  `;

  updateTimerDisplay();
}

function selectAnswer(index) {
  const q = state.exam.questions[state.currentIndex];
  state.answers[q.id] = [index];
  const options = document.querySelectorAll('.cursor-pointer');
  options.forEach((el, i) => {
    el.classList.toggle('option-selected', i === index);
  });
  updateNavButtons();
}

function toggleAnswer(index) {
  const q = state.exam.questions[state.currentIndex];
  const current = state.answers[q.id] || [];
  if (current.includes(index)) {
    state.answers[q.id] = current.filter(i => i !== index);
  } else {
    state.answers[q.id] = [...current, index];
  }
  const options = document.querySelectorAll('.cursor-pointer');
  options.forEach((el, i) => {
    el.classList.toggle('option-selected', state.answers[q.id].includes(i));
  });
  updateNavButtons();
}

function updateNavButtons() {
  const navBtns = document.querySelectorAll('.nav-btn');
  if (navBtns[state.currentIndex]) {
    const q = state.exam.questions[state.currentIndex];
    if (state.answers[q.id] && state.answers[q.id].length > 0) {
      navBtns[state.currentIndex].className = 'nav-btn answered';
    } else {
      navBtns[state.currentIndex].className = 'nav-btn';
    }
  }
}

function nextQuestion() {
  if (state.currentIndex < state.exam.questions.length - 1) {
    state.currentIndex++;
    render();
  }
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    render();
  }
}

function goToQuestion(index) {
  if (index >= 0 && index < state.exam.questions.length) {
    state.currentIndex = index;
    render();
  }
}

function confirmSubmit() {
  const unanswered = state.exam.questions.filter(q => !state.answers[q.id] || state.answers[q.id].length === 0);
  if (unanswered.length > 0) {
    if (!confirm(`⚠️ Anda belum menjawab ${unanswered.length} soal. Yakin ingin mengirim?`)) return;
  } else {
    if (!confirm('✅ Yakin ingin mengirim semua jawaban?')) return;
  }
  submitExam();
}

async function submitExam() {
  if (state.submitted) return;
  state.submitted = true;

  if (state.timer) {
    clearInterval(state.timer);
    state.timer = null;
  }

  let correct = 0;
  const total = state.exam.questions.length;
  state.exam.questions.forEach(q => {
    const userAnswer = state.answers[q.id] || [];
    const correctAnswer = q.answer || [];
    if (userAnswer.length === correctAnswer.length && 
        userAnswer.every(v => correctAnswer.includes(v))) {
      correct++;
    }
  });
  const score = Math.round((correct / total) * 100);

  const result = {
    student_name: state.student.name,
    school: state.student.school,
    branch: state.student.branch,
    exam_title: state.exam.judul,
    total_questions: total,
    correct_answers: correct,
    score: score,
    cheating_count: state.cheatCount,
    duration_seconds: state.exam.durasi - state.timeLeft,
    submitted_at: new Date().toISOString(),
    answers: state.answers
  };

  console.log('📊 Hasil Ujian:', result);

  try {
    const { error } = await sb
      .from('exam_results')
      .insert([result]);
    if (error) {
      console.warn('⚠️ Gagal simpan ke Supabase:', error.message);
    } else {
      console.log('✅ Hasil tersimpan di Supabase');
    }
  } catch (err) {
    console.warn('⚠️ Error simpan ke Supabase:', err.message);
  }

  alert(`✅ Ujian selesai! Nilai Anda: ${score}`);
  state.view = 'result';
  state.result = result;
  render();
}

function renderResult() {
  const r = state.result || { score: 0, correct_answers: 0, total_questions: 0 };
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
      <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <div class="text-center">
          <div class="text-6xl mb-3">${r.score >= 70 ? '🎉' : '📚'}</div>
          <h1 class="text-2xl font-bold">Ujian Selesai!</h1>
          <p class="text-gray-500 text-sm">${state.student.name}</p>
        </div>

        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-6 my-6 text-center">
          <div class="text-5xl font-bold text-blue-600">${r.score}%</div>
          <div class="text-sm text-gray-500">Nilai Akhir</div>
          <div class="grid grid-cols-2 gap-4 mt-3 text-center">
            <div><div class="text-2xl font-bold text-green-600">${r.correct_answers}</div><div class="text-sm text-gray-500">Benar</div></div>
            <div><div class="text-2xl font-bold text-red-600">${r.total_questions - r.correct_answers}</div><div class="text-sm text-gray-500">Salah</div></div>
          </div>
        </div>

        ${r.cheating_count > 0 ? `
          <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg mb-4">
            <p class="text-yellow-800 text-sm">⚠️ Terdeteksi ${r.cheating_count} kali pelanggaran</p>
          </div>
        ` : ''}

        <button onclick="backToLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
          Kembali ke Login
        </button>
      </div>
    </div>
  `;
}

function backToLogin() {
  console.log('🔙 Back to login');
  if (state.timer) {
    clearInterval(state.timer);
    state.timer = null;
  }
  state.view = 'login';
  state.exam = null;
  state.result = null;
  if (window.location.hash) {
    history.pushState(null, '', window.location.pathname);
  }
  render();
}

// ==========================================
// TIMER & ANTI CHEAT
// ==========================================
function startTimer() {
  if (state.timer) clearInterval(state.timer);

  state.timer = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      state.timer = null;
      alert('⏰ Waktu habis! Ujian otomatis dikirim.');
      submitExam();
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function activateAntiCheat() {
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && ['c', 'v', 'x', 'u'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      detectCheat('Keyboard shortcut');
    }
    if (e.key === 'F12') {
      e.preventDefault();
      detectCheat('F12');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.view === 'student') {
      detectCheat('Switch tab');
    }
  });
}

function detectCheat(action) {
  state.cheatCount++;
  const warn = document.getElementById('cheat-warn');
  if (warn) {
    warn.classList.remove('hidden');
    warn.textContent = `⚠️ ${state.cheatCount}x`;
  }
  console.warn(`⚠️ Pelanggaran #${state.cheatCount}: ${action}`);
  alert(`⚠️ PERINGATAN ${state.cheatCount}x: Anda ${action}!`);
}

function showTab(tab) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => {
    el.classList.add('hidden');
  });
  document.getElementById(`tab-${tab}-content`).classList.remove('hidden');
  
  document.querySelectorAll('[id^="tab-"]').forEach(el => {
    el.classList.remove('bg-blue-600', 'text-white');
    el.classList.add('bg-gray-200', 'text-gray-700');
  });
  document.getElementById(`tab-${tab}`).classList.remove('bg-gray-200', 'text-gray-700');
  document.getElementById(`tab-${tab}`).classList.add('bg-blue-600', 'text-white');
}

function addOption() {
  state.optionCount++;
  updateOptionsByType();

function removeOption() {
  if (state.optionCount <= 2) {
    alert('Minimal 2 opsi!');
    return;
  }
  state.optionCount--;
  updateOptionsByType();
}

function updateOptionsByType() {
  const type = document.getElementById('f-tipe-soal').value;
  const container = document.getElementById('options-container');
  const correctContainer = document.getElementById('correct-options');
  
  let optionCount = state.optionCount;
  let optionLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  let isMultiSelect = false;

  switch(type) {
    case 'PG': optionCount = Math.max(optionCount, 4); isMultiSelect = false; break;
    case 'PG5': optionCount = Math.max(optionCount, 5); isMultiSelect = false; break;
    case 'PGK': optionCount = Math.max(optionCount, 4); isMultiSelect = true; break;
    case 'BS': optionCount = 2; optionLabels = ['Benar', 'Salah']; isMultiSelect = false; break;
    case 'BSK': optionCount = 2; optionLabels = ['Benar', 'Salah']; isMultiSelect = true; break;
    case 'ST': optionCount = 2; optionLabels = ['Setuju', 'Tidak Setuju']; isMultiSelect = true; break;
    default: optionCount = Math.max(optionCount, 4); isMultiSelect = false;
  }

  state.optionCount = optionCount;

  let optionsHTML = '';
  for (let i = 0; i < optionCount; i++) {
    const label = optionLabels[i] || String.fromCharCode(65 + i);
    const imageUrl = state.optionImages[i] || '';
    optionsHTML += `
      <div class="option-input">
        <span class="font-bold text-sm w-6">${label}.</span>
        <input type="text" id="opt-${i}" placeholder="Teks opsi ${label}" class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
        <div class="option-image-upload">
          <input type="file" id="opt-img-${i}" accept="image/*" onchange="uploadOptionImage(${i}, this)" class="text-xs" />
          ${imageUrl ? `<img src="${imageUrl}" class="preview-thumb" id="opt-preview-${i}" />` : `<div id="opt-preview-${i}" class="w-10 h-10 border rounded border-gray-200 flex items-center justify-center text-xs text-gray-400">Preview</div>`}
          ${imageUrl ? `<button onclick="removeOptionImage(${i})" class="text-red-500 text-xs">✕</button>` : ''}
          <input type="hidden" id="opt-image-url-${i}" value="${imageUrl}" />
        </div>
        ${isMultiSelect ? `<input type="checkbox" id="correct-${i}" class="correct-checkbox" />` : ''}
        ${!isMultiSelect ? `<input type="radio" name="correct-answer" value="${i}" class="correct-radio" />` : ''}
        ${i >= 4 ? `<span class="remove-option" onclick="removeOption()">✕</span>` : ''}
      </div>
    `;
  }
  container.innerHTML = optionsHTML;

  let correctHTML = '';
  if (isMultiSelect) {
    correctHTML = `<p class="text-xs text-gray-500">* Centang kotak di samping opsi untuk jawaban benar (bisa lebih dari 1)</p>`;
  } else {
    for (let i = 0; i < optionCount; i++) {
      const label = optionLabels[i] || String.fromCharCode(65 + i);
      correctHTML += `<label class="flex items-center gap-1 text-sm"><input type="radio" name="correct-answer" value="${i}" /> ${label}</label>`;
    }
  }
  correctContainer.innerHTML = correctHTML;

  if (isMultiSelect) {
    document.querySelectorAll('.correct-checkbox').forEach((cb, i) => {
      cb.addEventListener('change', function() {
        const optInput = document.getElementById(`opt-${i}`);
        if (this.checked) {
          optInput.style.borderColor = '#22c55e';
          optInput.style.backgroundColor = '#dcfce7';
        } else {
          optInput.style.borderColor = '';
          optInput.style.backgroundColor = '';
        }
      });
    });
  }
}

// ==========================================
// UPLOAD GAMBAR PER OPSI KE SUPABASE STORAGE
// ==========================================
async function uploadOptionImage(index, input) {
  const file = input.files[0];
  if (!file) return;

  // Show loading
  const preview = document.getElementById(`opt-preview-${index}`);
  if (preview) {
    preview.innerHTML = '⏳';
    preview.className = 'w-10 h-10 border rounded border-gray-200 flex items-center justify-center text-xs text-gray-400';
  }

  try {
    // Upload ke Supabase Storage
    const fileName = `option_${Date.now()}_${file.name}`;
    const { data, error } = await sb
      .storage
      .from('exam-images')
      .upload(`options/${fileName}`, file);

    if (error) throw error;

    // Get public URL
    const { data: urlData } = sb
      .storage
      .from('exam-images')
      .getPublicUrl(`options/${fileName}`);

    const imageUrl = urlData.publicUrl;
    
    // Simpan ke state
    state.optionImages[index] = imageUrl;
    document.getElementById(`opt-image-url-${index}`).value = imageUrl;

    // Update preview
    if (preview) {
      preview.innerHTML = `<img src="${imageUrl}" class="preview-thumb" />`;
      preview.className = '';
    }

    // Tambah tombol hapus
    const container = document.getElementById(`opt-img-${index}`).parentElement;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'text-red-500 text-xs';
    removeBtn.innerHTML = '✕';
    removeBtn.onclick = () => removeOptionImage(index);
    container.appendChild(removeBtn);

    alert('✅ Gambar opsi berhasil diupload!');

  } catch (err) {
    console.error('❌ Gagal upload gambar:', err);
    alert('❌ Gagal upload gambar: ' + err.message);
    if (preview) {
      preview.innerHTML = '❌';
      preview.className = 'w-10 h-10 border rounded border-red-300 flex items-center justify-center text-xs text-red-500';
    }
  }
}

function removeOptionImage(index) {
  state.optionImages[index] = null;
  document.getElementById(`opt-image-url-${index}`).value = '';
  const preview = document.getElementById(`opt-preview-${index}`);
  if (preview) {
    preview.innerHTML = 'Preview';
    preview.className = 'w-10 h-10 border rounded border-gray-200 flex items-center justify-center text-xs text-gray-400';
  }
  // Hapus tombol hapus
  const container = document.getElementById(`opt-img-${index}`).parentElement;
  const removeBtn = container.querySelector('button.text-red-500');
  if (removeBtn) removeBtn.remove();
}

function previewImage(event) {
  const file = event.target.files[0];

  const reader = new FileReader();
  reader.onload = function(e) {
    const preview = document.getElementById('image-preview');
    const container = document.getElementById('image-preview-container');
    preview.src = e.target.result;
    container.classList.remove('hidden');
    state.imageData = e.target.result;

}

// ==========================================
// ADD QUESTION TO LIST (dengan gambar opsi)
// ==========================================
function addQuestionToList() {
  const teks = document.getElementById('f-teks').value.trim();
  if (!teks) {
    alert('Teks soal wajib diisi!');
    return;
  }

  const type = document.getElementById('f-tipe-soal').value;
  const narasi = document.getElementById('f-narasi')?.value.trim() || null;
  const imageUrl = document.getElementById('f-image-url')?.value || null;

  // Build options with images
  const options = [];
  for (let i = 0; i < state.optionCount; i++) {
    const text = document.getElementById(`opt-${i}`)?.value.trim();
    const image = document.getElementById(`opt-image-url-${i}`)?.value || null;
    if (text) {
      options.push({
        text: text,
        image: image
      });
    }
  }

  if (options.length < 2) {
    alert('Minimal 2 opsi jawaban!');
    return;
  }

  let correctAnswers = [];
  const isMultiSelect = ['PGK', 'BSK', 'ST'].includes(type);
  
  if (isMultiSelect) {
    document.querySelectorAll('.correct-checkbox').forEach((cb, i) => {
      if (cb.checked) correctAnswers.push(i);
    });
  } else {
    const radio = document.querySelector('input[name="correct-answer"]:checked');
    if (radio) correctAnswers.push(parseInt(radio.value));
  }

  if (correctAnswers.length === 0) {
    alert('Pilih jawaban yang benar!');
    return;
  }

  const question = {
    id: state.adminQuestions.length + 1,
    text: teks,
    narasi: narasi,
    image: imageUrl,
    options: options,
    type: type,
    answer: correctAnswers
  };

  state.adminQuestions.push(question);
  state.currentQuestionNumber = state.adminQuestions.length + 1;

  // Reset form
  document.getElementById('f-teks').value = '';
  if (document.getElementById('f-narasi')) document.getElementById('f-narasi').value = '';
  document.getElementById('f-image-url').value = '';
  document.getElementById('image-preview-container').classList.add('hidden');
  document.getElementById('f-image').value = '';
  state.imageData = null;
  state.optionImages = {};

  render();
  alert(`✅ Soal #${state.adminQuestions.length} berhasil ditambahkan!`);
}

function removeQuestionFromList(index) {
  if (confirm('Hapus soal ini?')) {
    state.adminQuestions.splice(index, 1);
    state.adminQuestions.forEach((q, i) => q.id = i + 1);
    render();
  }
}

function addQuestion() {
  state.currentQuestionNumber++;
  render();
}

function removeQuestion() {
  if (state.currentQuestionNumber <= 1) {
    alert('Minimal 1 soal!');
    return;
  }
  state.currentQuestionNumber--;
  render();
}

// ==========================================
// EXCEL FUNCTIONS
// ==========================================
function handleExcelFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet);
      
      excelData = jsonData;
      state.excelData = excelData;
      
      const previewDiv = document.getElementById('excel-preview');
      const dataPreview = document.getElementById('excel-data-preview');
      previewDiv.classList.remove('hidden');
      
      let html = `<table class="border-collapse border border-gray-300 w-full text-sm">`;
      if (jsonData.length > 0) {
        const headers = Object.keys(jsonData[0]);
        html += `<tr>${headers.map(h => `<th class="border border-gray-300 px-2 py-1 bg-blue-50">${h}</th>`).join('')}</tr>`;
        jsonData.slice(0, 10).forEach(row => {
          html += `<tr>${headers.map(h => `<td class="border border-gray-300 px-2 py-1">${row[h] || ''}</td>`).join('')}</tr>`;
        });
        if (jsonData.length > 10) {
          html += `<tr><td colspan="${headers.length}" class="text-center text-gray-400 py-2">... dan ${jsonData.length - 10} data lainnya</td></tr>`;
        }
      }
      html += `</table>`;
      html += `<p class="mt-2 text-sm text-gray-500">Total: ${jsonData.length} soal</p>`;
      dataPreview.innerHTML = html;
      
      document.getElementById('excel-file').value = '';
      document.getElementById('drop-zone').innerHTML = `
        <p class="text-green-500">✅ File siap diimport!</p>
        <p class="text-gray-500 text-sm">${file.name} (${jsonData.length} soal)</p>
      `;
      
    } catch (err) {
      alert('❌ Gagal membaca file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function importFromExcel() {
  if (!excelData || excelData.length === 0) {
    alert('Tidak ada data untuk diimport!');
    return;
  }

  const questions = [];
  excelData.forEach((row, index) => {
    const type = row.Tipe || row.tipe || 'PG';
    const text = row.Soal || row.soal || row.text || '';
    const narasi = row.Narasi || row.narasi || null;
    
    const options = [];
    const optionKeys = ['Opsi A', 'Opsi B', 'Opsi C', 'Opsi D', 'Opsi E', 'Opsi F', 'Opsi G', 'Opsi H'];
    optionKeys.forEach(key => {
      if (row[key]) {
        options.push({
          text: row[key].trim(),
          image: null
        });
      }
    });
    
    let answer = [];
    const jawaban = row.Jawaban || row.jawaban || '';
    if (jawaban) {
      const parts = jawaban.split(',').map(s => s.trim().toUpperCase());
      parts.forEach(p => {
        const idx = p.charCodeAt(0) - 65;
        if (idx >= 0 && idx < options.length) answer.push(idx);
      });
    }

    if (text && options.length >= 2 && answer.length > 0) {
      questions.push({
        id: index + 1,
        text: text,
        narasi: narasi,
        options: options,
        type: type,
        answer: answer
      });
    }
  });

  if (questions.length === 0) {
    alert('Tidak ada soal yang valid! Cek format Excel.');
    return;
  }

  state.adminQuestions = [...state.adminQuestions, ...questions];
  state.currentQuestionNumber = state.adminQuestions.length + 1;
  
  alert(`✅ ${questions.length} soal berhasil diimport!`);
  clearExcelData();
  render();
}

function clearExcelData() {
  excelData = [];
  state.excelData = null;
  document.getElementById('excel-preview').classList.add('hidden');
  document.getElementById('drop-zone').innerHTML = `
    <p class="text-gray-500">📁 Drag & drop file Excel (.xlsx) ke sini</p>
    <p class="text-gray-400 text-sm mt-2">atau</p>
    <button onclick="document.getElementById('excel-file').click()" class="mt-2 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
      Pilih File Excel
    </button>
    <input type="file" id="excel-file" accept=".xlsx,.xls" class="hidden" onchange="handleExcelFile(event)" />
  `;
}

async function saveAllQuestions() {
  const mapel = document.getElementById('f-mapel').value.trim();
  const kelas = document.getElementById('f-kelas').value.trim();
  const tipe = document.getElementById('f-tipe').value;
  const judul = document.getElementById('f-judul').value.trim();
  const durasi = parseInt(document.getElementById('f-durasi').value) || 3600;

  if (!mapel) { alert('Isi Mapel!'); document.getElementById('f-mapel').focus(); return; }
  if (!judul) { alert('Isi Judul Tes!'); document.getElementById('f-judul').focus(); return; }
  if (state.adminQuestions.length === 0) { alert('Tambah soal dulu!'); return; }

  try {
    const { error } = await sb
      .from('question_banks')
      .insert([{
        mapel,
        kelas,
        tipe_tes: tipe,
        judul_tes: judul,
        durasi: durasi,
        questions: state.adminQuestions,
        created_at: new Date().toISOString()
      }]);

    if (error) throw error;

    alert(`✅ Berhasil menyimpan ${state.adminQuestions.length} soal!`);
    
    state.adminQuestions = [];
    state.currentQuestionNumber = 1;
    document.getElementById('f-mapel').value = '';
    document.getElementById('f-kelas').value = '';
    document.getElementById('f-judul').value = '';
    render();

  } catch (err) {
    alert('❌ Gagal simpan: ' + err.message);
    console.error(err);
  }
}
