// ==========================================

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-500' };
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type]} text-white`;
  toast.innerHTML = `<span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-10px)'; setTimeout(() => toast.remove(), 300); }, 3000);
}

}

// ==========================================

// ==========================================
function shuffleArray(arr) {
  const newArr = [...arr];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

function detectMediaLinks(text) {
  if (!text) return { type: 'text', original: text };
  const youtubeRegex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\?]+)/;
  const match = text.match(youtubeRegex);
  if (match) return { type: 'video', embed: `https://www.youtube.com/embed/${match[1]}`, original: text };
  const imageRegex = /(https?:\/\/[^\s]+\.(?:jpg|jpeg|png|gif|webp|svg))/i;
  const imgMatch = text.match(imageRegex);
  if (imgMatch) return { type: 'image', url: imgMatch[1], original: text };
  return { type: 'text', original: text };
}

function renderMediaContent(text) {
  if (!text) return text;
  const detected = detectMediaLinks(text);
  if (detected.type === 'video') return `<div class="video-container"><iframe src="${detected.embed}" allowfullscreen loading="lazy"></iframe></div>`;
  if (detected.type === 'image') return `<img src="${detected.url}" class="image-preview" alt="Gambar" loading="lazy" />`;
  return text;
}

  const token = (document.getElementById('login-token').value || '').trim().toUpperCase();
  const name = document.getElementById('login-name').value.trim();

  if (!token) { showToast('Token ujian wajib diisi!', 'warning'); document.getElementById('login-token').focus(); return; }
  if (!name) { showToast('Nama lengkap wajib diisi!', 'warning'); document.getElementById('login-name').focus(); return; }

  const examTitle = document.getElementById('login-exam').value;
  if (!examTitle) { showToast('Pilih ujian terlebih dahulu!', 'warning'); return; }

  state.student = {
    name: name,
    school: document.getElementById('login-school').value.trim() || '-',
    branch: document.getElementById('login-branch').value.trim() || '-'
  };

  try {
    const { data, error } = await sb.from('question_banks').select('*').eq('judul_tes', examTitle).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('Ujian tidak ditemukan di database');

    const examToken = (data.token || '').trim().toUpperCase();
    if (examToken && token !== examToken) {
      showToast('❌ Token ujian salah!', 'error');
      return;
    }

    let questions = shuffleArray(data.questions || []);
    questions = questions.map(q => ({ ...q, options: shuffleArray(q.options || []) }));
    state.exam = { judul: data.judul_tes, durasi: data.durasi || 3600, questions };
  } catch (err) {
    showToast('❌ ' + err.message, 'error');
    console.error(err);
    return;
  }

  state.answers = {};
  state.exam.questions.forEach(q => { state.answers[q.id] = []; });
  state.currentIndex = 0;
  state.timeLeft = state.exam.durasi;
  state.cheatCount = 0;
  state.submitted = false;
  state.view = 'student';

  render();
  startTimer();
  activateAntiCheat();
}

function selectAnswer(index) {
  const q = state.exam.questions[state.currentIndex];
  state.answers[q.id] = [index];
  updateOptionUI();
}

function toggleAnswer(index) {
  const q = state.exam.questions[state.currentIndex];
  const current = state.answers[q.id] || [];
  if (current.includes(index)) state.answers[q.id] = current.filter(i => i !== index);
  else state.answers[q.id] = [...current, index];
  updateOptionUI();
}

function updateOptionUI() {
  const q = state.exam.questions[state.currentIndex];
  const selected = state.answers[q.id] || [];
  document.querySelectorAll('.option-card').forEach((el, i) => el.classList.toggle('option-selected', selected.includes(i)));
  updateNavButtons();
}

function updateNavButtons() {
  const navBtns = document.querySelectorAll('.nav-btn');
  if (navBtns[state.currentIndex]) {
    const q = state.exam.questions[state.currentIndex];
    if (state.answers[q.id] && state.answers[q.id].length > 0) navBtns[state.currentIndex].className = 'nav-btn answered';
    else navBtns[state.currentIndex].className = 'nav-btn';
  }
}

function nextQuestion() { if (state.currentIndex < state.exam.questions.length - 1) { state.currentIndex++; render(); } }
function prevQuestion() { if (state.currentIndex > 0) { state.currentIndex--; render(); } }
function goToQuestion(index) { if (index >= 0 && index < state.exam.questions.length) { state.currentIndex = index; render(); } }

function confirmSubmit() {
  const unanswered = state.exam.questions.filter(q => !state.answers[q.id] || state.answers[q.id].length === 0);
  if (unanswered.length > 0) {
    if (!confirm(`⚠️ Anda belum menjawab ${unanswered.length} soal. Yakin ingin mengirim?`)) return;
  } else {
    if (!confirm('✅ Yakin ingin mengirim semua jawaban?')) return;
  }
  submitExam();
}

async function submitExam() {
  if (state.submitted) return;
  state.submitted = true;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }

  let correct = 0;
  const total = state.exam.questions.length;
  state.exam.questions.forEach(q => {
    const userAnswer = state.answers[q.id] || [];
    const correctAnswer = q.answer || [];
    if (userAnswer.length === correctAnswer.length && userAnswer.every(v => correctAnswer.includes(v))) correct++;
  });
  const score = Math.round((correct / total) * 100);

  const result = {
    student_name: state.student.name,
    school: state.student.school,
    branch: state.student.branch,
    exam_title: state.exam.judul,
    total_questions: total,
    correct_answers: correct,
    score: score,
    cheating_count: state.cheatCount,
    duration_seconds: state.exam.durasi - state.timeLeft,
    submitted_at: new Date().toISOString(),
    answers: state.answers
  };

  try {
    const { error } = await sb.from('exam_results').insert([result]);
    if (error) console.warn('⚠️ Gagal simpan ke Supabase:', error.message);
  } catch (err) {
    console.warn('⚠️ Error simpan:', err.message);
  }

  state.view = 'result';
  state.result = result;
  render();
}

function renderResult() {
  const r = state.result || { score: 0, correct_answers: 0, total_questions: 0 };
  const passed = r.score >= 70;
  app.innerHTML = `
    <div class="elegant-bg min-h-screen flex items-center justify-center p-4 relative">
      <div class="floating-orb" style="width: 280px; height: 280px; background: ${passed ? '#10b981' : '#6366f1'}; top: 15%; left: 15%;"></div>

        <div class="text-center">
          <div class="w-14 h-14 mx-auto mb-2 rounded-xl flex items-center justify-center ${passed ? 'bg-gradient-to-br from-green-500 to-emerald-600' : 'bg-gradient-to-br from-blue-500 to-indigo-600'} shadow-lg">
            <span class="text-white" style="display: inline-flex; width: 28px; height: 28px;">${passed ? ICONS.trophy : ICONS.graduationCap}</span>
          </div>
          <h1 class="text-xl font-extrabold text-gray-800 dark:text-white">Ujian Selesai!</h1>
          <p class="text-[10px] text-gray-500 dark:text-gray-400">${state.student.name}</p>
        </div>
        <div class="bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl p-5 my-4 text-center text-white shadow-xl">
          <div class="text-4xl font-extrabold tracking-tight">${r.score}%</div>
          <div class="text-[10px] opacity-80">Nilai Akhir</div>
          <div class="grid grid-cols-2 gap-3 mt-3 text-center">
            <div class="bg-white/10 rounded-lg p-2"><div class="text-xl font-bold text-green-300">${r.correct_answers}</div><div class="text-[9px] opacity-80">Benar</div></div>
            <div class="bg-white/10 rounded-lg p-2"><div class="text-xl font-bold text-red-300">${r.total_questions - r.correct_answers}</div><div class="text-[9px] opacity-80">Salah</div></div>
          </div>
        </div>
        ${r.cheating_count > 0 ? `
          <div class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-700 p-2 rounded-lg mb-3">
            <p class="text-yellow-800 dark:text-yellow-300 text-[10px]">⚠️ Terdeteksi ${r.cheating_count} kali pelanggaran</p>
          </div>
        ` : ''}
        <button onclick="backToLogin()" class="btn-primary w-full text-sm">${ICONS.arrowLeft} Kembali ke Login</button>
      </div>
    </div>
  `;
}

function backToLogin() {
  if (state.timer) clearInterval(state.timer);
  state.view = 'login';
  state.exam = null;
  state.result = null;
  if (window.location.hash) history.pushState(null, '', window.location.pathname);
  render();
}

function startTimer() {
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft === 300) showToast('Waktu tersisa 5 menit!', 'warning');
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      state.timer = null;
      showToast('Waktu habis! Ujian otomatis dikirim.', 'warning');
      submitExam();
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function activateAntiCheat() {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && ['c', 'v', 'x', 'u'].includes(e.key.toLowerCase())) { e.preventDefault(); detectCheat('Keyboard shortcut'); }
    if (e.key === 'F12') { e.preventDefault(); detectCheat('F12'); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.view === 'student') detectCheat('Switch tab');
  });
}

function detectCheat(action) {
  state.cheatCount++;
  const warn = document.getElementById('cheat-warn');
  if (warn) { warn.classList.remove('hidden'); warn.innerHTML = `${ICONS.alertTriangle} ${state.cheatCount}x`; }
  showToast(`PERINGATAN ${state.cheatCount}x: ${action}!`, 'error');
}

async function loadDashboardData() {
  try {
    const { count: totalExams } = await sb.from('question_banks').select('*', { count: 'exact', head: true });
    const { data: participants } = await sb.from('exam_results').select('student_name');
    const { data: cheaters } = await sb.from('exam_results').select('cheating_count').gt('cheating_count', 0);
    const today = new Date().toISOString().split('T')[0];
    const { count: todayExams } = await sb.from('exam_results').select('*', { count: 'exact', head: true }).gte('submitted_at', today);
    const { data: scores } = await sb.from('exam_results').select('score');
    const el1 = document.getElementById('stat-exams');
    const el2 = document.getElementById('stat-students');
    const el3 = document.getElementById('stat-cheaters');
    const el4 = document.getElementById('stat-today');
    if (el1) el1.textContent = totalExams || 0;
    if (el2) el2.textContent = new Set(participants?.map(p => p.student_name)).size || 0;
    if (el3) el3.textContent = cheaters?.length || 0;
    if (el4) el4.textContent = todayExams || 0;
    renderChart(scores || []);
  } catch (err) { console.error('Gagal load dashboard:', err); }
}

function renderChart(scores) {
  const canvas = document.getElementById('scoreChart'); if (!canvas) return;
  const ranges = [
    { label: '0-20', min: 0, max: 20, count: 0 },
    { label: '21-40', min: 21, max: 40, count: 0 },
    { label: '41-60', min: 41, max: 60, count: 0 },
    { label: '61-80', min: 61, max: 80, count: 0 },
    { label: '81-100', min: 81, max: 100, count: 0 }
  ];
  scores.forEach(s => ranges.forEach(r => { if (s.score >= r.min && s.score <= r.max) r.count++; }));
  if (state.chartInstance) state.chartInstance.destroy();
  state.chartInstance = new Chart(canvas, {
    type: 'bar',

function loadCreateForm() {
  setTimeout(() => {
    updateOptionsByType();
    const narasiCheck = document.getElementById('f-pakai-narasi');
    if (narasiCheck) narasiCheck.addEventListener('change', function() { document.getElementById('narasi-container').classList.toggle('hidden', !this.checked); });
    const linkInput = document.getElementById('f-image-link');
    if (linkInput) {
      linkInput.addEventListener('change', function() {
        const url = this.value.trim();
        if (url) {
          document.getElementById('f-image-url').value = url;
          document.getElementById('image-preview').src = url;
          document.getElementById('image-preview-container').classList.remove('hidden');
        }
      });
    }
    const dropZone = document.getElementById('drop-zone');
    if (dropZone) {
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
      dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.classList.remove('drag-over');
        const files = e.dataTransfer.files;
        if (files.length > 0) handleExcelFile({ target: { files: files } });
      });
    }
  }, 100);
}

function switchTab(tab) {
  const mapel = document.getElementById('f-mapel');
  const kelas = document.getElementById('f-kelas');
  const tipe = document.getElementById('f-tipe');
  const judul = document.getElementById('f-judul');
  const durasi = document.getElementById('f-durasi');
  const token = document.getElementById('f-token');

  if (mapel) state.adminMeta = {
    mapel: mapel.value.trim(),
    kelas: kelas?.value.trim() || '',
    tipe: tipe?.value || 'PAS',
    judul: judul?.value.trim() || '',
    durasi: durasi?.value || '3600',
    token: token?.value.trim() || ''
  };

  if (tab === 'excel') state.editingQuestionIndex = null;
  state.activeTab = tab;
  render();
}

// ==========================================
// OPTIONS MANAGEMENT
// ==========================================
function addOption() { state.optionCount++; updateOptionsByType(); }
function removeOption() { if (state.optionCount <= 2) { showToast('Minimal 2 opsi!', 'warning'); return; } state.optionCount--; updateOptionsByType(); }

function updateOptionsByType() {
  const type = document.getElementById('f-tipe-soal')?.value || 'PG';
  const container = document.getElementById('options-container');
  const correctContainer = document.getElementById('correct-options');
  if (!container || !correctContainer) return;

  // ✅ Preserve nilai opsi yang sudah diketik (jaga-jaga saat toggle tipe)
  const oldValues = {};
  for (let i = 0; i < 8; i++) {
    const oldInput = document.getElementById(`opt-${i}`);
    if (oldInput && oldInput.value) oldValues[i] = oldInput.value;
  }

  let optionCount = state.optionCount;
  let optionLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  let isMultiSelect = false;

  switch(type) {
    case 'PG': optionCount = Math.max(optionCount, 4); isMultiSelect = false; break;
    case 'PG5': optionCount = Math.max(optionCount, 5); isMultiSelect = false; break;
    case 'PGK': optionCount = Math.max(optionCount, 4); isMultiSelect = true; break;
    case 'BS': optionCount = 2; optionLabels = ['Benar', 'Salah']; isMultiSelect = false; break;
    case 'BSK': optionCount = 2; optionLabels = ['Benar', 'Salah']; isMultiSelect = true; break;
    case 'ST': optionCount = 2; optionLabels = ['Setuju', 'Tidak Setuju']; isMultiSelect = true; break;
    default: optionCount = Math.max(optionCount, 4); isMultiSelect = false;
  }
  state.optionCount = optionCount;

  let optionsHTML = '';
  for (let i = 0; i < optionCount; i++) {
    const label = optionLabels[i] || String.fromCharCode(65 + i);
    const imageUrl = state.optionImages[i] || '';
    const existingValue = oldValues[i] || '';
    optionsHTML += `
      <div class="option-input p-2 bg-gray-50 dark:bg-gray-700/30 rounded-lg border border-gray-100 dark:border-gray-700">
        <span class="font-bold text-xs w-5 text-gray-700 dark:text-gray-300">${label}.</span>
        <input type="text" id="opt-${i}" value="${existingValue.replace(/"/g, '&quot;')}" placeholder="Teks opsi ${label}" class="flex-1 bg-transparent border-0 focus:ring-0 text-gray-700 dark:text-gray-300 text-sm" />
        <div class="option-image-upload flex items-center gap-1">
          <input type="file" id="opt-img-${i}" accept="image/*" onchange="uploadOptionImage(${i}, this)" class="text-[9px] text-gray-500" />
          ${imageUrl ? `<img src="${imageUrl}" class="preview-thumb" id="opt-preview-${i}" />` : `<div id="opt-preview-${i}" class="w-7 h-7 rounded-lg border border-gray-200 dark:border-gray-600 flex items-center justify-center text-[9px] text-gray-400">Prev</div>`}
          ${imageUrl ? `<button onclick="removeOptionImage(${i})" class="text-red-500 text-[9px]">✕</button>` : ''}
          <input type="hidden" id="opt-image-url-${i}" value="${imageUrl}" />
        </div>
        ${isMultiSelect ? `<input type="checkbox" id="correct-${i}" class="correct-checkbox accent-blue-600" />` : ''}
        ${!isMultiSelect ? `<input type="radio" name="correct-answer" value="${i}" class="correct-radio accent-blue-600" />` : ''}
      </div>
    `;
  }
  container.innerHTML = optionsHTML;

  let correctHTML = '';
  if (isMultiSelect) {
    correctHTML = `<p class="text-[9px] text-gray-500">* Centang kotak di samping opsi (bisa >1)</p>`;
  } else {
    for (let i = 0; i < optionCount; i++) {
      const label = optionLabels[i] || String.fromCharCode(65 + i);
      correctHTML += `<label class="flex items-center gap-1 text-xs text-gray-700 dark:text-gray-300"><input type="radio" name="correct-answer" value="${i}" class="accent-blue-600" /> ${label}</label>`;
    }
  }
  correctContainer.innerHTML = correctHTML;
}

// ==========================================
// UPLOAD GAMBAR
// ==========================================
async function uploadOptionImage(index, input) {
  const file = input.files[0]; if (!file) return;
  const preview = document.getElementById(`opt-preview-${index}`);
  if (preview) preview.innerHTML = '⏳';
  try {
    const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const fileName = `options/opt_${Date.now()}_${cleanName}`;
    const { data, error } = await sb.storage.from('exam-images').upload(fileName, file, { cacheControl: '3600', upsert: false, contentType: file.type });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('exam-images').getPublicUrl(fileName);
    state.optionImages[index] = urlData.publicUrl;
    document.getElementById(`opt-image-url-${index}`).value = urlData.publicUrl;
    if (preview) preview.innerHTML = `<img src="${urlData.publicUrl}" class="preview-thumb" />`;
    showToast('Gambar opsi diupload!', 'success');
  } catch (err) {
    showToast('Gagal upload: ' + err.message, 'error');
    if (preview) preview.innerHTML = '❌';
  }
}

function removeOptionImage(index) {
  state.optionImages[index] = null;
  document.getElementById(`opt-image-url-${index}`).value = '';
  const preview = document.getElementById(`opt-preview-${index}`);
  if (preview) preview.innerHTML = 'Prev';
}

function previewImage(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('image-preview').src = e.target.result;
    document.getElementById('image-preview-container').classList.remove('hidden');
    state.imageData = e.target.result;
  };
  reader.readAsDataURL(file);
}

function uploadImage() {
  const fileInput = document.getElementById('f-image');
  const linkInput = document.getElementById('f-image-link');
  if (fileInput && fileInput.files && fileInput.files.length > 0) {
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('f-image-url').value = e.target.result;
      document.getElementById('image-preview').src = e.target.result;
      document.getElementById('image-preview-container').classList.remove('hidden');
      showToast('Gambar siap!', 'success');
    };
    reader.readAsDataURL(file);
  } else if (linkInput && linkInput.value.trim()) {
    const url = linkInput.value.trim();
    document.getElementById('f-image-url').value = url;
    document.getElementById('image-preview').src = url;
    document.getElementById('image-preview-container').classList.remove('hidden');
    showToast('Gambar dari link siap!', 'success');
  } else {
    showToast('Pilih gambar atau link!', 'warning');
  }
}

function removeImage() {
  state.imageData = null;
  document.getElementById('image-preview-container').classList.add('hidden');
  document.getElementById('f-image').value = '';
  document.getElementById('f-image-link').value = '';
  document.getElementById('f-image-url').value = '';
}

function addQuestionToList() {
  const teks = document.getElementById('f-teks').value.trim();
  if (!teks) { showToast('Teks soal wajib!', 'warning'); return; }

  const type = document.getElementById('f-tipe-soal').value;
  const narasi = document.getElementById('f-narasi')?.value.trim() || null;
  const imageUrl = document.getElementById('f-image-url')?.value || null;
  const videoLink = document.getElementById('f-video-link')?.value.trim() || null;

  let videoEmbed = null;
  if (videoLink) {
    const match = videoLink.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\?]+)/);
    if (match) videoEmbed = `https://www.youtube.com/embed/${match[1]}`;
  }

  const options = [];
  for (let i = 0; i < state.optionCount; i++) {
    const text = document.getElementById(`opt-${i}`)?.value.trim();
    // ✅ BACA GAMBAR DARI STATE (bukan dari hidden input — hindari hilang saat re-render)
    const image = state.optionImages[i] || null;
    if (text) options.push({ text, image });
  }
  if (options.length < 2) { showToast('Minimal 2 opsi!', 'warning'); return; }

  let correctAnswers = [];
  const isMultiSelect = ['PGK', 'BSK', 'ST'].includes(type);
  if (isMultiSelect) {
    document.querySelectorAll('.correct-checkbox').forEach((cb, i) => { if (cb.checked) correctAnswers.push(i); });
  } else {
    const radio = document.querySelector('input[name="correct-answer"]:checked');
    if (radio) correctAnswers.push(parseInt(radio.value));
  }
  if (correctAnswers.length === 0) { showToast('Pilih jawaban benar!', 'warning'); return; }

  const isEditing = state.editingQuestionIndex !== null;
  const newId = isEditing ? state.adminQuestions[state.editingQuestionIndex].id : state.adminQuestions.length + 1;
  const question = { id: newId, text: teks, narasi, image: imageUrl, video: videoEmbed, options, type, answer: correctAnswers };

  if (isEditing) {
    // ✅ Update array tanpa menyentuh state.editingExamId
    state.adminQuestions[state.editingQuestionIndex] = question;
    const idx = state.editingQuestionIndex;
    state.editingQuestionIndex = null;

    // ✅ Reset state form
    state.imageData = null;
    state.optionImages = {};
    state.optionCount = 4;
    state.currentQuestionNumber = state.adminQuestions.length + 1;

    render();
    showToast(`✅ Soal #${idx + 1} diupdate!`, 'success');
    return;
  }

  state.adminQuestions.push(question);
  state.currentQuestionNumber = state.adminQuestions.length + 1;
  state.imageData = null;
  state.optionImages = {};
  state.optionCount = 4;
  render();
  showToast(`✅ Soal #${state.adminQuestions.length} ditambahkan!`, 'success');
}

      const match = q.video.match(/embed\/([^?]+)/);
      fVideoLink.value = match ? `https://www.youtube.com/watch?v=${match[1]}` : q.video;

          if (optPreview) optPreview.outerHTML = `<img src="${opt.image}" class="preview-thumb" id="opt-preview-${i}" />`;
        }
      });

      (q.answer || []).forEach(ansIdx => {

          const cb = document.getElementById(`correct-${ansIdx}`);
          if (cb) cb.checked = true;
        } else {
          const radio = document.querySelector(`input[name="correct-answer"][value="${ansIdx}"]`);

      if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

function handleExcelFile(event) {
  const file = event.target.files[0];
  const input = event.target;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet);
      state.excelData = jsonData;
      const previewDiv = document.getElementById('excel-preview');
      const dataPreview = document.getElementById('excel-data-preview');
      previewDiv.classList.remove('hidden');
      let html = `<table class="border-collapse border border-gray-300 dark:border-gray-600 w-full text-sm">`;
      if (jsonData.length > 0) {
        const headers = Object.keys(jsonData[0]);
        html += `<tr>${headers.map(h => `<th class="border border-gray-300 dark:border-gray-600 px-2 py-1 bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs">${h}</th>`).join('')}</tr>`;
        jsonData.slice(0, 10).forEach(row => {
          html += `<tr>${headers.map(h => `<td class="border border-gray-300 dark:border-gray-600 px-2 py-1 text-xs text-gray-700 dark:text-gray-300">${row[h] || ''}</td>`).join('')}</tr>`;
        });
        if (jsonData.length > 10) html += `<tr><td colspan="${headers.length}" class="text-center text-gray-400 text-xs py-2">... dan ${jsonData.length - 10} data lainnya</td></tr>`;
      }
      html += `</table><p class="mt-2 text-xs text-gray-500">Total: ${jsonData.length} soal</p>`;
      dataPreview.innerHTML = html;
      document.getElementById('drop-zone').innerHTML = `<p class="text-green-500 text-sm">✅ File siap diimport! (${jsonData.length} soal)</p>`;
      render();
      setTimeout(() => {
        state.activeTab = 'excel';
        const dz = document.getElementById('drop-zone');
        if (dz && state.excelData.length > 0) {
          dz.innerHTML = `<p class="text-green-500 text-sm">✅ ${state.excelData.length} soal siap diimport</p>`;
          const preview = document.getElementById('excel-preview');
          if (preview) preview.classList.remove('hidden');
          if (state.excelData.length > 0) {
            const dp = document.getElementById('excel-data-preview');
            if (dp) {
              const headers = Object.keys(state.excelData[0]);
              let h = `<table class="border-collapse border border-gray-300 dark:border-gray-600 w-full text-sm">`;
              h += `<tr>${headers.map(hh => `<th class="border border-gray-300 dark:border-gray-600 px-2 py-1 bg-gray-50 dark:bg-gray-700 text-xs">${hh}</th>`).join('')}</tr>`;
              state.excelData.slice(0, 10).forEach(row => {
                h += `<tr>${headers.map(hh => `<td class="border border-gray-300 dark:border-gray-600 px-2 py-1 text-xs">${row[hh] || ''}</td>`).join('')}</tr>`;
              });
              h += `</table>`;
              dp.innerHTML = h;
            }
          }
        }
      }, 100);
    } catch (err) {
      showToast('Gagal baca file: ' + err.message, 'error');
    } finally {
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

async function importFromExcel() {
  if (!state.excelData || state.excelData.length === 0) {
    showToast('Tidak ada data!', 'warning'); return;
  }

  const m = state.adminMeta || {};
  const mapel = (m.mapel || '').trim();
  const kelas = (m.kelas || '').trim();
  const tipe = m.tipe || 'PAS';
  const judul = (m.judul || '').trim();
  const durasi = parseInt(m.durasi) || 3600;
  const token = (m.token || '').trim().toUpperCase() || null;

  if (!mapel || !judul) {
    showToast('Isi Mapel & Judul Tes dulu di tab Manual!', 'warning');
    switchTab('manual');
    return;
  }

  const questions = [];
  state.excelData.forEach((row, index) => {
    const norm = {};
    Object.keys(row).forEach(k => { norm[k.toString().trim().toLowerCase()] = row[k]; });

    const type = (norm.tipe || norm.type || 'PG').toString().trim().toUpperCase();
    const text = (norm.soal || norm.text || '').toString().trim();
    const narasiRaw = norm.narasi;
    const narasi = (narasiRaw && narasiRaw.toString().trim() !== '-' && narasiRaw.toString().trim() !== '') ? narasiRaw.toString().trim() : null;

    const options = [];
    ['opsi a', 'opsi b', 'opsi c', 'opsi d', 'opsi e', 'opsi f'].forEach(key => {
      if (norm[key] && norm[key].toString().trim() !== '') {
        options.push({ text: norm[key].toString().trim(), image: null });
      }
    });

    let answer = [];
    const jawabanRaw = (norm.jawaban || '').toString().trim();
    if (jawabanRaw) {
      const parts = jawabanRaw.split(',').map(s => s.trim()).filter(Boolean);
      parts.forEach(p => {
        const upper = p.toUpperCase();
        if (type === 'BS' || type === 'BSK') {
          if (['BENAR', 'B', 'TRUE', '1'].includes(upper)) answer.push(0);
          else if (['SALAH', 'S', 'FALSE', '0'].includes(upper)) answer.push(1);
          return;
        }
        if (type === 'ST') {
          if (['SETUJU', 'S', 'STS'].includes(upper) && upper !== 'TIDAK SETUJU') answer.push(0);
          else if (['TIDAK SETUJU', 'TS', 'TIDAK'].includes(upper)) answer.push(1);
          return;
        }
        const idx = upper.charCodeAt(0) - 65;
        if (idx >= 0 && idx < options.length) answer.push(idx);
      });
    }

    if (text && options.length >= 2 && answer.length > 0) {
      questions.push({ id: questions.length + 1, text, narasi, options, type, answer, image: null, video: null });
    }
  });

  if (questions.length === 0) {
    showToast('Tidak ada soal valid! Cek format Excel.', 'warning');
    return;
  }

  try {
    const { error } = await sb.from('question_banks').insert([{
      mapel, kelas, tipe_tes: tipe, judul_tes: judul, durasi, token,
      questions: questions,
      created_at: new Date().toISOString()
    }]);
    if (error) throw error;

    showToast(`✅ ${questions.length} soal BERHASIL disimpan ke database!`, 'success');

    state.excelData = [];
    state.adminQuestions = [];
    state.currentQuestionNumber = 1;
    state.editingQuestionIndex = null;
    state.adminMeta = { mapel: '', kelas: '', tipe: 'PAS', judul: '', durasi: '3600', token: '' };
    state.activeTab = 'manual';

    window._examsCache = null;
    goToAdminMenu('exams');
  } catch (err) {
    console.error('Import error:', err);
    showToast('❌ Gagal simpan ke DB: ' + err.message, 'error');
    alert('Error detail:\n' + err.message + '\n\nKemungkinan penyebab:\n1. Kolom `token` belum ada di tabel question_banks\n2. RLS policy belum allow INSERT\n3. Koneksi internet bermasalah');
  }
}

  if (!mapel || !judul) { showToast('Mapel & Judul wajib!', 'warning'); return; }

  try {
    const { data, error } = await sb.from('question_banks').update({

    }).eq('id', state.editingExamId).select();

    state.editingExamData = null;
    state.editingQuestionIndex = null;
    state.adminQuestions = [];
    state.currentQuestionNumber = 1;
    state.optionImages = {};
    state.imageData = null;

    const { data: exams } = await sb.from('question_banks').select('id, judul_tes, mapel, kelas, tipe_tes');
    const examTitles = (exams || []).map(e => e.judul_tes);

    // Group by exam_title
    const groups = {};
    (data || []).forEach(r => {
      const key = r.exam_title || '(Tanpa Judul)';
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });

    // Include exam yang belum ada peserta
    examTitles.forEach(t => { if (!groups[t]) groups[t] = []; });

    window._reportsData = { data: data || [], exams: exams || [], groups };

    if (Object.keys(groups).length === 0) {
      container.innerHTML = `<div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-lg text-center"><p class="text-blue-600 dark:text-blue-400 text-sm">Belum ada data peserta ujian</p></div>`;
      return;
    }

    let html = '';
    Object.entries(groups).forEach(([title, rows]) => {
      const total = rows.length;
      const avg = total > 0 ? Math.round(rows.reduce((s, r) => s + (r.score || 0), 0) / total) : 0;
      const max = total > 0 ? Math.max(...rows.map(r => r.score || 0)) : 0;
      const min = total > 0 ? Math.min(...rows.map(r => r.score || 0)) : 0;
      const cheaters = rows.filter(r => (r.cheating_count || 0) > 0).length;
      const examInfo = (exams || []).find(e => e.judul_tes === title);

      html += `
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 border border-gray-100 dark:border-gray-700 mb-3">
          <div class="flex justify-between items-start flex-wrap gap-2 mb-3">
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-gray-800 dark:text-white text-sm flex items-center gap-2 flex-wrap">
                ${ICONS.fileText} ${title}
                ${examInfo ? `<span class="badge badge-purple text-[9px]">${examInfo.mapel}</span>` : ''}
                ${examInfo?.kelas ? `<span class="badge badge-yellow text-[9px]">${examInfo.kelas}</span>` : ''}
                ${examInfo ? `<span class="badge badge-green text-[9px]">${examInfo.tipe_tes}</span>` : ''}
              </h3>
              <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mt-2 text-center">
                <div class="bg-blue-50 dark:bg-blue-900/20 rounded-lg p-2">
                  <div class="text-lg font-extrabold text-blue-700 dark:text-blue-300">${total}</div>
                  <div class="text-[9px] text-blue-600 dark:text-blue-400">Peserta</div>
                </div>
                <div class="bg-green-50 dark:bg-green-900/20 rounded-lg p-2">
                  <div class="text-lg font-extrabold text-green-700 dark:text-green-300">${avg}%</div>
                  <div class="text-[9px] text-green-600 dark:text-green-400">Rata-rata</div>
                </div>
                <div class="bg-purple-50 dark:bg-purple-900/20 rounded-lg p-2">
                  <div class="text-lg font-extrabold text-purple-700 dark:text-purple-300">${max}%</div>
                  <div class="text-[9px] text-purple-600 dark:text-purple-400">Tertinggi</div>
                </div>
                <div class="bg-red-50 dark:bg-red-900/20 rounded-lg p-2">
                  <div class="text-lg font-extrabold text-red-700 dark:text-red-300">${min}%</div>
                  <div class="text-[9px] text-red-600 dark:text-red-400">Terendah</div>
                </div>
                <div class="bg-amber-50 dark:bg-amber-900/20 rounded-lg p-2">
                  <div class="text-lg font-extrabold text-amber-700 dark:text-amber-300">${cheaters}</div>
                  <div class="text-[9px] text-amber-600 dark:text-amber-400">Pelanggaran</div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex gap-1.5 flex-wrap">
            <button onclick="exportPerExam('${title.replace(/'/g, "\\'")}')" class="btn-success text-xs py-1 px-3">${ICONS.fileSpreadsheet} Unduh Excel (${total} peserta)</button>
            <button onclick="deleteResultsByExam('${title.replace(/'/g, "\\'")}')" class="btn-danger text-xs py-1 px-3">${ICONS.alertTriangle} Hapus Data (${total})</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<p class="text-red-500 text-sm">❌ ${err.message}</p>`;
  }
}

function exportPerExam(examTitle) {
  const groups = window._reportsData?.groups || {};
  const rows = groups[examTitle] || [];
  if (rows.length === 0) { showToast('Tidak ada peserta untuk ujian ini!', 'warning'); return; }

  const wb = XLSX.utils.book_new();
  const header = [['No', 'Nama', 'Sekolah', 'Kota/Kab', 'Ujian', 'Benar', 'Total', 'Nilai', 'Pelanggaran', 'Durasi (detik)', 'Waktu Submit']];
  rows.forEach((r, i) => header.push([
    i + 1, r.student_name, r.school || '-', r.branch || '-', r.exam_title,
    r.correct_answers, r.total_questions, r.score + '%', r.cheating_count || 0,
    r.duration_seconds || 0, new Date(r.submitted_at).toLocaleString('id-ID')
  ]));
  const ws = XLSX.utils.aoa_to_sheet(header);
  ws['!cols'] = [{ wch: 5 }, { wch: 20 }, { wch: 25 }, { wch: 15 }, { wch: 30 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 20 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Hasil Ujian');

  // Sheet rekap
  const avg = Math.round(rows.reduce((s, r) => s + (r.score || 0), 0) / rows.length);
  const rekap = [
    ['REKAP LAPORAN', ''],
    ['Judul Ujian', examTitle],
    ['Total Peserta', rows.length],
    ['Rata-rata Nilai', avg + '%'],
    ['Nilai Tertinggi', Math.max(...rows.map(r => r.score || 0)) + '%'],
    ['Nilai Terendah', Math.min(...rows.map(r => r.score || 0)) + '%'],
    ['Total Pelanggaran', rows.reduce((s, r) => s + (r.cheating_count || 0), 0)],
    ['Tanggal Export', new Date().toLocaleString('id-ID')]
  ];
  const wsRekap = XLSX.utils.aoa_to_sheet(rekap);
  wsRekap['!cols'] = [{ wch: 25 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, wsRekap, 'Rekap');

  const safeTitle = examTitle.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 40);
  XLSX.writeFile(wb, `laporan_${safeTitle}_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast(`✅ Laporan "${examTitle}" berhasil diunduh!`, 'success');
}

async function exportGlobalExcel() {
  try {
    const { data, error } = await sb.from('exam_results').select('*').order('exam_title').order('submitted_at', { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) { showToast('Tidak ada data!', 'warning'); return; }

    const wb = XLSX.utils.book_new();

    // Sheet 1: Semua data
    const rows = [['No', 'Ujian', 'Nama', 'Sekolah', 'Kota/Kab', 'Benar', 'Total', 'Nilai', 'Pelanggaran', 'Durasi (detik)', 'Waktu Submit']];
    data.forEach((r, i) => rows.push([
      i + 1, r.exam_title, r.student_name, r.school || '-', r.branch || '-',
      r.correct_answers, r.total_questions, r.score + '%', r.cheating_count || 0,
      r.duration_seconds || 0, new Date(r.submitted_at).toLocaleString('id-ID')
    ]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 5 }, { wch: 30 }, { wch: 20 }, { wch: 25 }, { wch: 15 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Semua Peserta');

    // Sheet 2: Rekap per ujian
    const groups = {};
    data.forEach(r => {
      const k = r.exam_title || '(Tanpa Judul)';
      if (!groups[k]) groups[k] = [];
      groups[k].push(r);
    });
    const rekapRows = [['Ujian', 'Jumlah Peserta', 'Rata-rata', 'Tertinggi', 'Terendah', 'Total Pelanggaran']];
    Object.entries(groups).forEach(([title, rows]) => {
      const avg = Math.round(rows.reduce((s, r) => s + (r.score || 0), 0) / rows.length);
      rekapRows.push([
        title, rows.length, avg + '%',
        Math.max(...rows.map(r => r.score || 0)) + '%',
        Math.min(...rows.map(r => r.score || 0)) + '%',
        rows.reduce((s, r) => s + (r.cheating_count || 0), 0)
      ]);
    });
    const wsRekap = XLSX.utils.aoa_to_sheet(rekapRows);
    wsRekap['!cols'] = [{ wch: 35 }, { wch: 15 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, wsRekap, 'Rekap Per Ujian');

    XLSX.writeFile(wb, `laporan_global_${new Date().toISOString().split('T')[0]}.xlsx`);
    showToast(`✅ Laporan global (${data.length} peserta) berhasil diunduh!`, 'success');
  } catch (err) {
    showToast('Gagal export: ' + err.message, 'error');
  }
}

async function deleteResultsByExam(examTitle) {
  const groups = window._reportsData?.groups || {};
  const count = (groups[examTitle] || []).length;
  if (count === 0) { showToast('Tidak ada data untuk dihapus!', 'warning'); return; }
  if (!confirm(`⚠️ HAPUS PERMANEN ${count} data peserta untuk ujian:\n\n"${examTitle}"\n\nData akan hilang dari database. Lanjutkan?`)) return;

  try {
    const { error } = await sb.from('exam_results').delete().eq('exam_title', examTitle);
    if (error) throw error;
    showToast(`✅ ${count} data peserta "${examTitle}" terhapus!`, 'success');
    loadReportsData();
  } catch (err) {
    showToast('Gagal hapus: ' + err.message, 'error');
  }
}

async function globalCleanup() {
  if (!confirm('⚠️ HAPUS SEMUA DATA PESERTA dari database?\n\nTindakan ini PERMANEN dan tidak bisa dibatalkan!')) return;
  if (!confirm('⚠️ KONFIRMASI TERAKHIR: Semua hasil ujian siswa akan hilang. Yakin?')) return;

  try {
    // Supabase butuh filter untuk delete all. Pakai .neq pada kolom id dengan nilai yang pasti tidak ada.
    const { error, count } = await sb.from('exam_results').delete({ count: 'exact' }).gte('id', 0);
    if (error) throw error;
    showToast(`✅ ${count ?? 'Semua'} data peserta terhapus!`, 'success');
    loadReportsData();
  } catch (err) {
    showToast('Gagal hapus: ' + err.message, 'error');
  }
}

async function loadStudentsData() {
  const container = document.getElementById('students-list');
  if (!container) return;
  container.innerHTML = '<p class="text-gray-400 text-sm">⏳ Memuat...</p>';
  try {
    const { data, error } = await sb.from('exam_results')
      .select('id, student_name, school, branch, exam_title, score, correct_answers, total_questions, cheating_count, submitted_at, duration_seconds, answers')
      .order('submitted_at', { ascending: false });
    if (error) throw error;
    window._studentsCache = data || [];
    if (!data || data.length === 0) {
      container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 text-center py-4 text-sm">Belum ada siswa</p>`;
      return;
    }
    filterStudentsTable();
  } catch (err) {
    container.innerHTML = `<p class="text-red-500 text-sm">❌ ${err.message}</p>`;
  }
}

function filterStudentsTable() {
  const container = document.getElementById('students-list');
  if (!container) return;
  const filter = (document.getElementById('filter-student')?.value || '').toLowerCase();
  const data = (window._studentsCache || []).filter(s =>
    (s.student_name || '').toLowerCase().includes(filter) ||
    (s.school || '').toLowerCase().includes(filter) ||
    (s.exam_title || '').toLowerCase().includes(filter)
  );
  if (data.length === 0) {
    container.innerHTML = `<p class="text-gray-400 text-center py-4 text-sm">Tidak ada data yang cocok</p>`;
    return;
  }
  container.innerHTML = `<div class="overflow-x-auto"><table class="table-modern w-full">
    <thead><tr>
      <th>No</th><th>Nama</th><th>Sekolah</th><th>Ujian</th>
      <th class="text-center">Benar</th><th class="text-center">Nilai</th>
      <th class="text-center">Pelanggaran</th><th>Waktu</th><th class="text-center">Aksi</th>
    </tr></thead>
    <tbody>
      ${data.map((s, i) => `
        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <td>${i+1}</td>
          <td class="font-semibold dark:text-white">${s.student_name}</td>
          <td>${s.school || '-'}</td>
          <td class="text-xs">${s.exam_title}</td>
          <td class="text-center">${s.correct_answers}/${s.total_questions}</td>
          <td class="text-center"><span class="badge ${s.score >= 70 ? 'badge-green' : 'badge-red'} font-bold">${s.score}%</span></td>
          <td class="text-center">${s.cheating_count > 0 ? `<span class="badge badge-red">${s.cheating_count}x</span>` : `<span class="text-gray-400">0</span>`}</td>
          <td class="text-[10px] text-gray-500">${new Date(s.submitted_at).toLocaleString('id-ID')}</td>
          <td class="text-center"><button onclick="lihatDetail(${s.id})" class="btn-ghost text-xs py-0.5 px-2">${ICONS.eye}</button></td>
        </tr>
      `).join('')}
    </tbody></table></div>
    <p class="text-xs text-gray-500 mt-2">Total: ${data.length} siswa</p>`;
}

function lihatDetail(id) {
  const d = (window._studentsCache || []).find(x => x.id === id);
  if (!d) return;
  const answers = d.answers || {};
  const answersText = Object.entries(answers).map(([qid, ans]) => `Soal ${qid}: [${Array.isArray(ans) ? ans.join(', ') : ans}]`).join('\n');
  alert(`👤 ${d.student_name}\n🏫 ${d.school} - ${d.branch}\n📚 ${d.exam_title}\n\n✅ Benar: ${d.correct_answers}/${d.total_questions}\n📊 Nilai: ${d.score}\n⚠️ Pelanggaran: ${d.cheating_count || 0}\n⏱️ Durasi: ${d.duration_seconds || 0} detik\n📅 Submit: ${new Date(d.submitted_at).toLocaleString('id-ID')}\n\n📝 Jawaban:\n${answersText || '(tidak tersedia)'}`);
}

async function loadSettings() {
  try {
    const { data, error } = await sb.from('app_settings').select('*').maybeSingle();
    if (error) return;
    if (data) {
      state.settings = {
        schoolName: data.school_name || 'SMA Negeri 1',
        schoolAddress: data.school_address || 'Jl. Pendidikan No. 1, Jakarta',
        schoolLogo: data.school_logo || '',
        primaryColor: data.primary_color || '#2563eb'
      };
      render();
    }
  } catch (err) { console.warn('loadSettings:', err.message); }
}

async function saveSettings() {
  const schoolName = document.getElementById('set-school-name').value.trim();
  const schoolAddress = document.getElementById('set-school-address').value.trim();
  const schoolLogo = document.getElementById('set-logo-url').value;
  if (!schoolName) { showToast('Nama sekolah wajib!', 'warning'); return; }
  state.settings.schoolName = schoolName;
  state.settings.schoolAddress = schoolAddress;
  state.settings.schoolLogo = schoolLogo;
  try {
    const { error } = await sb.from('app_settings').upsert({
      id: 1,
      school_name: schoolName,
      school_address: schoolAddress,
      school_logo: schoolLogo,
      primary_color: state.settings.primaryColor,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
    showToast('✅ Setting disimpan!', 'success');
    render();
  } catch (err) { showToast('Gagal simpan: ' + err.message, 'error'); }
}

function setPrimaryColor(color) {
  state.settings.primaryColor = color;
  document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('active', el.style.background === color));
  const colorInput = document.getElementById('set-color');
  if (colorInput) colorInput.value = color;
}

async function uploadLogo(event) {
  const file = event.target.files[0]; if (!file) return;
  try {
    const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const { data, error } = await sb.storage.from('exam-images').upload(`settings/logo_${Date.now()}_${cleanName}`, file, { cacheControl: '3600', upsert: false });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('exam-images').getPublicUrl(data.path);
    document.getElementById('set-logo-url').value = urlData.publicUrl;
    showToast('✅ Logo diupload!', 'success');
    await loadSettings();
  } catch (err) { showToast('Gagal upload: ' + err.message, 'error'); }
}

function removeLogo() {
  state.settings.schoolLogo = '';
  const urlInput = document.getElementById('set-logo-url');
  if (urlInput) urlInput.value = '';
  render();
  showToast('Logo dihapus (klik Simpan untuk konfirmasi)', 'info');
}

// ==========================================
// EXPORT EXCEL
// ==========================================
async function exportToExcel() {
  try {
    const { data, error } = await sb.from('exam_results').select('*').order('submitted_at', { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) { showToast('Tidak ada data!', 'warning'); return; }
    const wb = XLSX.utils.book_new();
    const rows = [['No', 'Nama', 'Sekolah', 'Kota/Kab', 'Ujian', 'Benar', 'Total', 'Nilai', 'Pelanggaran', 'Durasi (detik)', 'Waktu Submit']];
    data.forEach((r, i) => rows.push([
      i + 1, r.student_name, r.school || '-', r.branch || '-', r.exam_title,
      r.correct_answers, r.total_questions, r.score + '%', r.cheating_count || 0,
      r.duration_seconds || 0, new Date(r.submitted_at).toLocaleString('id-ID')
    ]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 5 }, { wch: 20 }, { wch: 25 }, { wch: 15 }, { wch: 30 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 15 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Hasil Ujian');
    XLSX.writeFile(wb, `laporan_ujian_${new Date().toISOString().split('T')[0]}.xlsx`);
    showToast(`✅ Berhasil export ${data.length} data!`, 'success');
  } catch (err) { showToast('Gagal export: ' + err.message, 'error'); }
}

// ==========================================
// LOGOUT
// ==========================================
function logout() {
  if (!confirm('Logout dari admin?')) return;
  state.adminAuthed = false;
  sessionStorage.removeItem('adminAuthed');
  sessionStorage.removeItem('fromAdmin');
  state.view = 'login';
  state.exam = null;
  state.result = null;
  history.pushState(null, '', window.location.pathname);
  render();
}

// ==========================================
// START
// ==========================================
checkHash();
if (state.view === 'login' && !state.adminAuthed) {
  render();
} else if (state.adminAuthed && window.location.hash === '#admin') {
  goToAdmin();
}
